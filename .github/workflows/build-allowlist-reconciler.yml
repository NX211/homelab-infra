name: Build allowlist-reconciler

# Builds the in-cluster staging allowlist reconciler image and pushes it to
# GHCR, then pins the published digest into the deployment manifest so Argo
# rolls it out. Runs on changes to the app source or this workflow, or on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/allowlist-reconciler/**"
      - ".github/workflows/build-allowlist-reconciler.yml"

concurrency:
  group: build-allowlist-reconciler
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nx211/allowlist-reconciler
  VERSION: "0.1.0"
  MANIFEST: allowlist-reconciler/deployment.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC)
    steps:
      # Use a GitHub App token so the digest pin-back commit can push to main
      # (and trigger no protected-branch friction), mirroring gitops-staging-update.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Gate the build on the unit tests. They run against the real ack() source
      # lifted out of src/index.mjs, so a regression fails here rather than
      # shipping an image that silently stops recording applied versions.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Test
        working-directory: apps/allowlist-reconciler
        run: node --test

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/allowlist-reconciler
          platforms: linux/amd64
          push: true
          # Single-arch, no attestation manifests — keeps a clean manifest the
          # kubelet pulls by digest without provenance/SBOM side manifests.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      # Keyless cosign signature so verify-image-signatures-business can verify
      # ghcr.io/nx211/* by this workflow's OIDC identity. Sign by digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        env:
          IMAGE_DIGEST: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4

      - name: Pin digest into manifest
        env:
          REF: ${{ env.IMAGE }}:${{ env.VERSION }}@${{ steps.push.outputs.digest }}
        run: |
          # Point the deployment at the immutable digest and drop the Artifact
          # Registry pull secret (the GHCR package is public, so no secret needed).
          yq -i '.spec.template.spec.containers[0].image = strenv(REF)
                 | del(.spec.template.spec.imagePullSecrets)' "$MANIFEST"

      - name: Commit pin-back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "$MANIFEST"; then
            echo "No manifest change; digest already pinned."
            exit 0
          fi
          git add "$MANIFEST"
          git commit -m "chore(allowlist-reconciler): pin image ${{ steps.push.outputs.digest }}"
          # Concurrent image builds each push a pin-back to main; rebase + retry
          # so a non-fast-forward rejection self-heals (each build pins a
          # different file, so the rebase never conflicts).
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::pin-back push failed after 5 attempts"; exit 1
