name: Build Synapse S3 Image

# Builds the custom Synapse image (element-hq/synapse + synapse-s3-storage-provider)
# and pushes it to GHCR. Runs on changes to the Dockerfile, or on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "helm-charts/matrix/docker/synapse-s3/**"
      - ".github/workflows/build-synapse-s3.yml"

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nx211/synapse-s3
      SYNAPSE_VERSION: "1.155.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: helm-charts/matrix/docker/synapse-s3
          build-args: SYNAPSE_VERSION=${{ env.SYNAPSE_VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SYNAPSE_VERSION }}
            ${{ env.IMAGE }}:latest

      # Keyless cosign signature so verify-image-signatures-business can verify
      # ghcr.io/nx211/* by this workflow's OIDC identity. Sign by digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        env:
          IMAGE_DIGEST: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"
