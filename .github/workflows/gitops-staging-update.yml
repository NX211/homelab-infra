name: GitOps Staging Update
on:
  repository_dispatch:
    types: [staging-image-push]

concurrency:
  group: gitops-staging-${{ github.event.client_payload.app_name }}
  cancel-in-progress: false

jobs:
  update:
    name: Update Staging Helm Values
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Validate payload
        id: validate
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          DIGEST: ${{ github.event.client_payload.digest }}
          IMAGE: ${{ github.event.client_payload.image }}
          TAG: ${{ github.event.client_payload.tag }}
          MIGRATE_DIGEST: ${{ github.event.client_payload.migrate_digest }}
        run: |
          if [ -z "$APP_NAME" ] || [ -z "$DIGEST" ] || [ -z "$IMAGE" ]; then
            echo "ERROR: Missing required fields in client_payload"
            echo "  app_name=$APP_NAME"
            echo "  digest=$DIGEST"
            echo "  image=$IMAGE"
            exit 1
          fi

          # Regex-validate every dispatch field before use (ci-cd standard;
          # staging-track.yml is the reference). digest/migrate_digest must be
          # exact sha256 refs; tag is optional but must stay in the docker tag
          # charset when present.
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "ERROR: Invalid digest: $DIGEST"
            exit 1
          fi
          if [ -n "$MIGRATE_DIGEST" ] && ! printf '%s' "$MIGRATE_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "ERROR: Invalid migrate_digest: $MIGRATE_DIGEST"
            exit 1
          fi
          if [ -n "$TAG" ] && ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9@][A-Za-z0-9@._-]{0,127}$'; then
            echo "ERROR: Invalid tag: $TAG"
            exit 1
          fi

          # Reject app_name and image values containing path traversal
          # or shell metacharacters. Everything that flows through this
          # workflow originates from a trusted Cloud Run dispatch, but
          # defense in depth is cheap.
          if ! printf '%s' "$APP_NAME" | grep -qE '^[a-zA-Z0-9_-]+$'; then
            echo "ERROR: Invalid app_name: $APP_NAME"
            exit 1
          fi

          VALUES_FILE="staging-apps/${APP_NAME}/values.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: Staging chart not found at ${VALUES_FILE}"
            echo "Known staging apps:"
            ls staging-apps/
            exit 1
          fi

          # Extract the short image name (last path segment, e.g.
          # "dispatchr-web" or "dispatchr-worker") from the full AR
          # reference. Used as a per-image PR branch suffix so concurrent
          # web/worker pushes don't overwrite each other's changes on a
          # shared branch — the previous fixed `staging/<app>` branch
          # was silently force-pushed by each subsequent dispatch.
          #
          # gitops-trigger dispatches the IMAGE field with whichever ref
          # form the AR pubsub event carried: a bare repo path, a
          # `:tag` suffix, or (most common) an `@sha256:...` digest
          # suffix. Strip the suffix before validating so the regex
          # only sees the repo-short name. The order is @ first then
          # :tag to handle both cleanly.
          IMAGE_SHORT="${IMAGE##*/}"
          IMAGE_SHORT="${IMAGE_SHORT%@*}"
          IMAGE_SHORT="${IMAGE_SHORT%%:*}"
          if ! printf '%s' "$IMAGE_SHORT" | grep -qE '^[a-zA-Z0-9_-]+$'; then
            echo "ERROR: Failed to extract valid short image name from IMAGE=$IMAGE"
            exit 1
          fi

          echo "image_short=${IMAGE_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Updating staging ${APP_NAME} (${IMAGE_SHORT}) to digest ${DIGEST}"

      - name: Install yq
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4

      # Re-fetch latest main right before making changes. Other queued
      # runs in the same concurrency group may have merged PRs between
      # the initial checkout and now, so the working tree could be stale.
      - name: Refresh to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Update image digest
        id: update
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          DIGEST: ${{ github.event.client_payload.digest }}
          TAG: ${{ github.event.client_payload.tag }}
          MIGRATE_DIGEST: ${{ github.event.client_payload.migrate_digest }}
          IMAGE_SHORT: ${{ steps.validate.outputs.image_short }}
        run: |
          VALUES_FILE="staging-apps/${APP_NAME}/values.yaml"

          # Values are nested under the staging-app subchart key. Worker
          # images live under a different values path and have no migrate
          # sibling — mirror of the values-path routing in platform-infra's
          # gitops-update.yml. Without this, a worker dispatch would clobber
          # the web image digest.
          DIGEST_PATH='."staging-app".image.digest'
          IS_WORKER=false
          if [[ "$IMAGE_SHORT" == *-worker ]]; then
            DIGEST_PATH='."staging-app".worker.image.digest'
            IS_WORKER=true
          fi

          yq eval "${DIGEST_PATH} = \"${DIGEST}\"" -i "${VALUES_FILE}"

          # Update migration digest whenever the deploy workflow publishes a
          # new migrate image and the chart declares a migration block. Don't
          # gate on `migration.enabled`: charts can disable the upstream
          # subchart's job (enabled: false) while running an override Job that
          # reads the same digest. Gating on enabled freezes the override at
          # whatever digest was last seeded — staging-promote then propagates
          # that stale value to prod, and schema changes silently never run
          # (same failure mode that broke capturly-web v1.5/v1.6, mirror of
          # the platform-infra gitops-update.yml fix in PR #589).
          # Worker dispatches never carry a migrate sibling.
          if [ "$IS_WORKER" = "false" ] && [ -n "$MIGRATE_DIGEST" ]; then
            HAS_MIGRATION=$(yq eval '.["staging-app"].migration // "null"' "${VALUES_FILE}")
            if [ "$HAS_MIGRATION" != "null" ]; then
              yq eval ".\"staging-app\".migration.digest = \"${MIGRATE_DIGEST}\"" -i "${VALUES_FILE}"
              echo "Updated migration digest to ${MIGRATE_DIGEST}"
            fi
          fi

          # Normalize incoming tag to bare semver before writing it to
          # Chart.yaml's appVersion. Two upstream tag conventions arrive
          # here:
          #
          #   release-please: 'v0.1.27'         -> NORMALIZED_TAG='0.1.27'
          #   Changesets:     'coreyalan@0.1.27' -> NORMALIZED_TAG='0.1.27'
          #
          # Strip a leading 'v' (release-please) OR a trailing '@semver'
          # segment (Changesets). The resulting string must match strict
          # semver so any unexpected shape (e.g. an SDK-style tag that
          # somehow leaked through, or a pre-release with build metadata
          # we don't yet support) is rejected — the chart's appVersion
          # is left untouched and only digests advance for that dispatch.
          #
          # Helm tolerates a 'v' prefix in appVersion but rejects '@', so
          # the prefix must be stripped to keep `helm lint` happy.
          NORMALIZED_TAG=""
          if [[ "$TAG" == *@* ]]; then
            NORMALIZED_TAG="${TAG##*@}"
          elif [[ "$TAG" == v* ]]; then
            NORMALIZED_TAG="${TAG#v}"
          fi

          # Only dispatches carrying a release tag are eligible for prod
          # promotion. One AR push emits a pubsub event per tag, so a single
          # release fans out into several staging-image-push dispatches: the
          # git-SHA tag event (no semver) and the vX.Y.Z event (semver). Both
          # deploy to staging, but only the release-tag PR gets the `promote`
          # label that staging-promote.yml requires — otherwise every release
          # promoted twice (duplicate promote_to_production Port runs, moved
          # prod-PR heads, duplicate announce builds dying on ALREADY_SENT).
          # Tagless/manual builds (workflow_dispatch → sha tag only) deploy to
          # staging and deliberately never auto-promote: prod deploys correlate
          # on the v<semver> identity (framework git-and-releases standard).
          PROMOTE=false
          if [[ "$NORMALIZED_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PROMOTE=true
            CHART_FILE="staging-apps/${APP_NAME}/Chart.yaml"
            if [ -f "$CHART_FILE" ]; then
              yq eval ".appVersion = \"${NORMALIZED_TAG}\"" -i "${CHART_FILE}"
              echo "Updated appVersion in ${CHART_FILE} to ${NORMALIZED_TAG} (from incoming tag ${TAG})"
            fi
          else
            echo "Skipping appVersion update: tag '${TAG}' did not normalize to bare semver"
          fi
          echo "promote=${PROMOTE}" >> "$GITHUB_OUTPUT"

          echo "Updated ${VALUES_FILE}:"
          yq eval '.["staging-app"].image' "${VALUES_FILE}"
          yq eval '.migration' "${VALUES_FILE}"

      - name: Helm lint
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          helm lint "staging-apps/${APP_NAME}"

      - name: Create PR
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Per-image branch (staging/<app>/<image-short>) so concurrent
          # dispatches for different images in the same app don't race
          # on a shared branch and force-push each other's changes away.
          branch: staging/${{ github.event.client_payload.app_name }}/${{ steps.validate.outputs.image_short }}
          title: "staging: update ${{ github.event.client_payload.app_name }} (${{ steps.validate.outputs.image_short }}) image"
          body: |
            Automated staging image update

            - **App:** `${{ github.event.client_payload.app_name }}`
            - **Image:** `${{ steps.validate.outputs.image_short }}`
            - **Digest:** `${{ github.event.client_payload.digest }}`
            - **Tag:** `${{ github.event.client_payload.tag || 'N/A' }}`

            ${{ steps.update.outputs.promote == 'true'
              && 'Release-tagged: on merge, `staging-promote.yml` dispatches the prod gitops update (gated by `staging/ok` on the prod PR).'
              || 'No release tag: deploys to staging only; prod promotion requires a `v<semver>`-tagged dispatch.' }}
          # `promote` marks the one release-tag PR per release that
          # staging-promote.yml is allowed to act on — see the comment in the
          # update step above.
          labels: staging,auto-merge${{ steps.update.outputs.promote == 'true' && ',promote' || '' }}
          delete-branch: true

      - name: Merge PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          # Merge directly instead of using --auto. Auto-merge enables
          # the merge but doesn't wait — the job finishes, the
          # concurrency lock releases, and other queued runs can merge
          # PRs that make this one conflict before auto-merge fires.
          # Direct merge holds the concurrency lock until the PR is
          # actually merged, preventing the race condition.
          #
          # If required checks exist, wait for them first (up to 10 min).
          if ! gh pr merge "$PR_NUMBER" --squash 2>&1; then
            echo "Direct merge failed — waiting for status checks"
            gh pr checks "$PR_NUMBER" --watch --fail-fast || true
            gh pr merge "$PR_NUMBER" --squash
          fi
