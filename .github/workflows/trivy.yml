name: Trivy Repo Scan

# Misconfiguration scan for the repo's Dockerfiles, Helm charts and k8s/Kyverno
# manifests. REPORT-ONLY for now (SARIF + table in the logs): this repo had never
# been scanned, so it's introduced audit-first — same posture as the Kyverno
# Audit->Enforce flip. Once the baseline is triaged, flip to a blocking CRITICAL
# gate (accepted findings are recorded, with a statement and expiry, in
# .trivyignore.yaml; the ignore-lint job keeps that file to the org standard).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Trivy config scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      - name: Trivy config SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
        continue-on-error: true

  # Same rule as the org conformance check (deploy-workflows conformance.yml):
  # every ignore entry needs a statement and an unquoted expired_at at most 90
  # days out. The script is read from that workflow at a pinned commit, not
  # copied, so the two cannot drift; bump the ref to pick up rule changes.
  ignore-lint:
    name: Trivy ignore entries carry a statement and an expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run the org trivyignore rule
        env:
          CONFORMANCE_URL: https://raw.githubusercontent.com/Corey-Alan-Consulting/deploy-workflows/5447e0daf9c21af792a6c749bf2b1693f8298278/.github/workflows/conformance.yml
        run: |
          set -euo pipefail
          curl -fsSL "$CONFORMANCE_URL" -o "$RUNNER_TEMP/conformance.yml"
          python3 - "$RUNNER_TEMP/conformance.yml" > "$RUNNER_TEMP/trivyignore_rule.py" <<'EOF'
          import sys, yaml
          wf = yaml.safe_load(open(sys.argv[1]))
          name = "Trivy ignore entries carry a statement and an expiry"
          steps = [s for s in wf["jobs"]["conformance"]["steps"] if s.get("name") == name]
          if len(steps) != 1:
              sys.exit(f"step {name!r} not found in conformance.yml")
          print(steps[0]["run"])
          EOF
          python3 "$RUNNER_TEMP/trivyignore_rule.py"
