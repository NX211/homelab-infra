# Accepted misconfigurations, each scoped to its path so the same rule still
# fires anywhere else. Every entry carries a statement (why it is acceptable and
# what ends it) and an expired_at at most 90 days out; once it lapses Trivy
# reports the finding again and the PR lint fails until the entry is renewed or
# removed on purpose. Dates stay unquoted: Trivy rejects a quoted one.
misconfigurations:
  - id: KSV-0014
    paths:
      - "kratix/install.yaml"
    statement: >-
      kratix/install.yaml is a pristine copy of the upstream Kratix release asset
      that kratix-revendor.yml overwrites wholesale, so it has no
      readOnlyRootFilesystem. kratix/kustomization.yaml patches it in, and that
      rendered output is what ArgoCD deploys (`kubectl kustomize kratix | trivy
      config -` reports no KSV-0014). Valid only while that overlay exists; ends
      if the overlay is dropped or upstream ships the setting.
    expired_at: 2027-01-30
  - id: KSV-0041
    paths:
      - "kratix/install.yaml"
    statement: >-
      Vendored Kratix platform-manager ClusterRole: the controller must manage
      tenant Secrets to provision tenants, which is its job. Ends when upstream
      Kratix narrows the role or the controller is removed.
    expired_at: 2027-01-30
  - id: KSV-0050
    paths:
      - "kratix/install.yaml"
    statement: >-
      Vendored Kratix platform-manager ClusterRole: the controller must bind and
      escalate Roles to provision tenants, which is its job. Ends when upstream
      Kratix narrows the role or the controller is removed.
    expired_at: 2027-01-30
  - id: KSV-0113
    paths:
      - "ar-token-refresher/rbac.yaml"
      - "tekton/chains/rbac.yaml"
    statement: >-
      ar-token-refresher must create/update the pull secret it writes into each
      consuming namespace, and chains-token-refresher exists to write one Secret.
      RBAC cannot scope `create` by resourceName, so that verb is namespace-wide;
      update/patch are name-scoped, so neither can touch other Secrets. Ends for
      ar-token-refresher when its remaining namespaces (staging, provisioning,
      capturly-live) move to ESO GCRAccessToken tokens and it is deleted.
    expired_at: 2027-01-30
  - id: KSV-0113
    paths:
      - "external-secrets-operator/manifests/artifact-registry-token-rbac.yaml"
    statement: >-
      The artifact-registry-token store's reader Role grants only `get` on the
      one ESO-minted Artifact Registry token Secret, by resourceName. KSV-0113
      does not evaluate resourceNames, so it flags any Secrets grant. Ends when
      the rule honours resourceNames or the scoped store is replaced.
    expired_at: 2027-01-30
  - id: KSV-0125
    paths:
      - "build-registry-proxy/prisma-mirror.yaml"
      - "build-registry-proxy/maven-mirror.yaml"
      - "tekton/chains/refresher.yaml"
    statement: >-
      The prisma-engines and maven mirrors pull nginxinc/nginx-unprivileged and
      chains-token-refresher pulls alpine/k8s from docker.io (the same images the
      sibling verdaccio proxy and ar-token-refresher already run); every other
      KSV finding on these files is hardened. Ends when these images are
      re-mirrored to a trusted registry (ghcr/Artifact Registry).
    expired_at: 2027-01-30
  - id: KSV-0109
    paths:
      - "tekton/chains/refresher.yaml"
    statement: >-
      The chains-token-refresher ConfigMap holds the refresh script, not a
      credential; the matches are shell identifiers and literals (subjectToken,
      AUTH_B64, oidc-token, a Secret name, a service-account email). Every token
      is minted in-cluster into a Secret that is not in git. Ends if the script
      moves out of the ConfigMap or the component is retired.
    expired_at: 2027-01-30
  - id: KSV-01010
    paths:
      - "tekton/chains/refresher.yaml"
      - "kyverno-policies-business/registry-auth-adc.yaml"
    statement: >-
      Both match non-secret text: the chains-token-refresher script's shell
      identifiers and the '{auths' of the dockerconfigjson it builds at runtime,
      and the Kyverno external_account ADC's service_account_impersonation_url,
      which names an account to impersonate and holds no key material (that is
      why it replaces a banned SA key). Ends if either file gains real key
      material or the components are retired.
    expired_at: 2027-01-30
