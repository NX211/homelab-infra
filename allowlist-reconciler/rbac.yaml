---
# Least privilege: read base ConfigMaps + read/patch Traefik Middlewares, granted
# per watched namespace (the deployment's NAMESPACES). No cluster-wide access, no
# secrets access via the API. An app in its own namespace grants the same Role
# to this ServiceAccount from its own chart (so it exists with the namespace,
# e.g. staging-apps/gatherbee/templates/ipallowlist.yaml), in the change that
# adds the namespace to NAMESPACES.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allowlist-reconciler
  namespace: staging
  labels:
    app.kubernetes.io/name: allowlist-reconciler
    app.kubernetes.io/part-of: staging
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['traefik.io']
    resources: ['middlewares']
    verbs: ['get', 'list', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allowlist-reconciler
  namespace: staging
  labels:
    app.kubernetes.io/name: allowlist-reconciler
    app.kubernetes.io/part-of: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: allowlist-reconciler
subjects:
  - kind: ServiceAccount
    name: allowlist-reconciler
    namespace: staging
