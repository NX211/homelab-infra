---
# Kratix (L3, ADR-0018) — the platform-framework operator + CRDs, vendored from
# the upstream `latest` release (github.com/syntasso/kratix, kratix.yaml asset).
# Upstream stopped cutting semver tags after v0.125.0 (Jul 2024) and now ships a
# rolling `latest`, so there is no version to pin to.
#
# Refresh via the weekly .github/workflows/kratix-revendor.yml, which re-vendors
# the whole asset and opens a PR. Do NOT bump the image digest on its own: the
# controller, its CRDs and its RBAC ship as one artifact with no version to
# correlate them by, and a Renovate manager that moved only the image skewed
# them on 2026-09-04 — the newer controller stopped writing
# status.workflows{,Failed,Succeeded} while the vendored CRD still required
# them, so every Promise status write was rejected, the reconciler spun, and
# 2438 untidied reconcile Jobs OOM-killed both this controller and
# trivy-operator for three days. That manager has been removed.
#
# Needs cert-manager (homelab has it) for the webhook serving cert.
# ServerSideApply for the large CRDs; negative sync-wave so the operator + CRDs
# land before the kratix-config app's CRs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kratix
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nx211/homelab-infra.git
    targetRevision: main
    path: kratix
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
