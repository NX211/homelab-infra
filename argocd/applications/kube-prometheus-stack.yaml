---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.11.0
    helm:
      valuesObject:
        # Disable components we don't need
        kubeStateMetrics:
          enabled: true

        nodeExporter:
          enabled: true

        grafana:
          enabled: false  # Using separate Grafana deployment

        # Prometheus configuration
        prometheus:
          prometheusSpec:
            # Node placement
            nodeSelector:
              kubernetes.io/hostname: blacktalon

            # Retention
            retention: 30d
            retentionSize: "45GB"

            # Storage
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi

            # Resource limits
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi

            # ServiceMonitor selectors - select all ServiceMonitors
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}

            # PodMonitor selectors - select all PodMonitors
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}

            # Scrape interval
            scrapeInterval: 15s
            evaluationInterval: 15s

            # External labels
            externalLabels:
              cluster: 'k3s'
              environment: 'production'

            # Enable admin API for management
            enableAdminAPI: true

          # Service configuration
          service:
            type: ClusterIP
            port: 9090

        # Alertmanager configuration
        alertmanager:
          enabled: true

          # Until this existed, every rule fired into `receiver: "null"` — the
          # chart's default. 34 rule groups, 23 alerts firing, nothing delivered
          # anywhere, including two controllers in CrashLoopBackOff. An alerting
          # stack that reports healthy and notifies no one is the same class of
          # problem as an unsigned image annotated `signed: "true"`.
          #
          # Pushover, because that is what prod already pages through
          # (platform-infra terraform/modules/alerting) — same account, so this
          # does not invent a second channel to forget about. Credentials are
          # read from files so nothing is inlined here; see
          # monitoring-manifests/externalsecrets.yaml.
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ["namespace", "alertname"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: pushover
              routes:
                # Watchdog is the always-firing heartbeat that proves the
                # pipeline works; paging on it every 12h would train exactly the
                # wrong reflex. InfoInhibitor is plumbing, not a signal.
                - matchers: ['alertname = "Watchdog"']
                  receiver: "null"
                - matchers: ['alertname = "InfoInhibitor"']
                  receiver: "null"
                - matchers: ['severity = "info"']
                  receiver: "null"
                - matchers: ['severity = "critical"']
                  receiver: pushover-critical
                  repeat_interval: 4h
            receivers:
              - name: "null"
              - name: pushover
                pushover_configs:
                  - user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user-key
                    token_file: /etc/alertmanager/secrets/alertmanager-pushover/api-token
                    priority: "0"
                    title: '[staging] {{ .CommonLabels.alertname }} ({{ .Alerts.Firing | len }} firing)'
                    message: |-
                      {{ range .Alerts -}}
                      {{ .Labels.namespace }}/{{ .Labels.pod }}{{ .Labels.job_name }}
                      {{ .Annotations.summary }}
                      {{ end }}
              - name: pushover-critical
                pushover_configs:
                  - user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user-key
                    token_file: /etc/alertmanager/secrets/alertmanager-pushover/api-token
                    # 1 = high priority: bypasses the quiet hours a homelab
                    # otherwise silently swallows overnight alerts into.
                    priority: "1"
                    title: '[staging CRITICAL] {{ .CommonLabels.alertname }}'
                    message: |-
                      {{ range .Alerts -}}
                      {{ .Labels.namespace }}/{{ .Labels.pod }}{{ .Labels.job_name }}
                      {{ .Annotations.summary }}
                      {{ end }}

          alertmanagerSpec:
            # Mounts at /etc/alertmanager/secrets/alertmanager-pushover/, which is
            # what the *_file settings above point at.
            secrets:
              - alertmanager-pushover
            # Node placement
            nodeSelector:
              kubernetes.io/hostname: blacktalon

            # Storage
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

            # Resource limits
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

        # Prometheus Operator configuration
        prometheusOperator:
          # Node placement for operator itself
          nodeSelector:
            kubernetes.io/hostname: blacktalon

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Default rules - keep most of them
        defaultRules:
          create: true
          rules:
            alertmanager: true
            etcd: false  # Not using etcd
            configReloaders: true
            general: true
            k8s: true
            kubeApiserverAvailability: true
            kubeApiserverBurnrate: true
            kubeApiserverHistogram: true
            kubeApiserverSlos: true
            # k3s embeds the scheduler, controller-manager and kube-proxy in
            # the server process: there are no discrete pods and no separate
            # metrics endpoints, so these three groups alert Down permanently and
            # can never clear. They were harmless while everything went to
            # /dev/null; with delivery on they would be three standing false
            # pages, which is how people learn to ignore the channel. The
            # apiserver is scraped and healthy.
            kubeControllerManager: false
            kubelet: true
            kubeProxy: false
            kubePrometheusGeneral: true
            kubePrometheusNodeRecording: true
            kubernetesApps: true
            kubernetesResources: true
            kubernetesStorage: true
            kubernetesSystem: true
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: true
            kubeStateMetrics: true
            network: true
            node: true
            nodeExporterAlerting: true
            nodeExporterRecording: true
            prometheus: true
            prometheusOperator: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
