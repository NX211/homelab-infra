---
# Kyverno admission engine (staging). Mirrors the prod control (platform-infra)
# so staging can validate policy compliance, not just app behavior. Policies are
# rolled out in AUDIT first (kyverno-policies + kyverno-policies-business apps);
# nothing is rejected until each policy is deliberately graduated to Enforce.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    # Engine + CRDs before any policy app that references them.
    argocd.argoproj.io/sync-wave: "-5"
    # Server-Side Diff for this app only: server-side dry-run apply so
    # apiserver/webhook defaulting stops reading as false drift (with the
    # field-manager ignoreDifferences in argocd-cm). Not global (see argocd values).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.0
    helm:
      valuesObject:
        # Single replica per controller — staging is resource-constrained. The
        # admission webhook uses failurePolicy per policy; Audit policies never
        # block, so a brief controller blip cannot wedge deploys.
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        reportsController:
          replicas: 1
        cleanupController:
          replicas: 1

        crds:
          migration:
            # The chart's CRD-migration post-upgrade hook cannot work under
            # ArgoCD. Its ServiceAccount and RBAC carry
            # `hook-delete-policy: hook-succeeded`, while the Job that uses them
            # carries no delete policy at all:
            #
            #   ServiceAccount        weight=100  del=before-hook-creation,hook-succeeded
            #   ClusterRole(Binding)  weight=100  del=before-hook-creation,hook-succeeded,hook-failed
            #   Job                   weight=200  del=NONE
            #
            # Helm applies delete policies after the whole hook phase finishes.
            # ArgoCD applies them per resource, and a ServiceAccount is
            # "succeeded" the moment it exists -- so the RBAC is torn down while
            # the Job is still running and the Job dies with "Error:
            # Unauthorized", then lingers forever because it has no delete
            # policy of its own.
            #
            # The migration itself is already done: every kyverno CRD reports a
            # single storedVersion matching its storage version (v1/v2), which
            # is exactly the end state a successful migration produces.
            #
            # If a future chart bump genuinely needs a storage migration, check
            # for a CRD whose status.storedVersions has more than one entry and
            # run it by hand:
            #
            #   kubectl get crd <name> -o jsonpath='{.status.storedVersions}'
            #   kubectl kyverno migrate --resource <name>
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
