---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0
    helm:
      valuesObject:
        # Deployment mode - single binary for simplicity
        deploymentMode: SingleBinary

        # Single binary configuration
        singleBinary:
          replicas: 1

          # Node placement
          nodeSelector:
            kubernetes.io/hostname: blacktalon

          # Resources
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          # Persistence
          persistence:
            enabled: true
            storageClass: local-path
            size: 50Gi

        # Loki configuration
        loki:
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          storage:
            type: filesystem

          schemaConfig:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          # Retention. 30d stays the default for application logs; the streams
          # that carry evidence are kept for a year (design §5.3/§5.4, §8.4).
          #
          # §5.3 describes this as a `{job="kube-audit"}` stream, but that stream
          # does not exist on this cluster -- the kube-apiserver audit policy is
          # Phase 3 work on the business cluster. What this cluster does hold,
          # for as long as it hosts the build platform, is the deploy history
          # (ArgoCD events, §5.2) and the build/approval history (Tekton and the
          # build namespaces, §5.4). Those are selected by namespace, which is a
          # label promtail already sets.
          #
          # Storage: 17G of the 100Gi PVC covers 30d of *everything*; the
          # evidence subset is a small fraction of that volume, so a year of it
          # fits comfortably. Revisit if the PVC passes ~70%.
          limits_config:
            retention_period: 30d
            retention_stream:
              - selector: '{namespace=~"argocd|tekton-pipelines|tekton-operator|pipelines-as-code|arc-systems|arc-runners|.+-builds-.+"}'
                priority: 1
                period: 8760h
            max_query_length: 0h
            max_query_parallelism: 32

          # Compactor for retention enforcement
          compactor:
            retention_enabled: true
            delete_request_store: filesystem

        # Monitoring
        monitoring:
          serviceMonitor:
            enabled: true
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false

        # Disable simple scalable components (conflicts with SingleBinary mode)
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        # Service configuration
        gateway:
          enabled: false

        # Test pod disabled
        test:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
