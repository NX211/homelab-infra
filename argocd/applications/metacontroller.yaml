---
# Metacontroller (staging) — bare install of the upstream chart. Ships CRDs
# (CompositeController, DecoratorController, ControllerRevision), so it mirrors
# the CRD-safe pattern from kyverno.yaml: Server-Side Diff + ServerSideApply and
# a negative sync-wave so the CRDs land before anything that references them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metacontroller
  namespace: argocd
  annotations:
    # CRDs early, before any controller that references them.
    argocd.argoproj.io/sync-wave: "-1"
    # Server-Side Diff for this app only: server-side dry-run apply so
    # apiserver defaulting on the CRDs stops reading as false drift.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/metacontroller
    chart: metacontroller-helm
    targetRevision: 4.16.7
    helm:
      valuesObject:
        # Modest footprint for staging.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: metacontroller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
