---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-bench
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/NX211/homelab-infra.git
    targetRevision: HEAD
    path: security-bench
  destination:
    server: https://kubernetes.default.svc
    namespace: security-bench
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Privileged like system-upgrade: kube-bench needs hostPID and hostPath.
    # No environment/plane label, so it stays outside the business plane.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/audit: privileged
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
