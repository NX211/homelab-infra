---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Name follows the `staging-<prod-app-name>` convention so staging-promote.yml
  # (`ARGO_APP="staging-${APP_NAME}"`), the gitops-trigger STAGING_APP_MAP, and the
  # PR branch naming all line up without per-app special cases.
  name: staging-reggiesbbq
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: reggiesbbq
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/NX211/homelab-infra.git
    targetRevision: HEAD
    path: staging-apps/reggiesbbq
  destination:
    server: https://kubernetes.default.svc
    # Own namespace, as on prod (X4 app parity). Moved before the chart changes,
    # so the namespace-wide policies of nextjs-app never meet the shared one.
    namespace: reggiesbbq-staging
  # The allowlist-reconciler owns this Middleware's sourceRange (base ∪ reviewer
  # IPs); ignore it so selfHeal won't revert runtime writes.
  ignoreDifferences:
    - group: traefik.io
      kind: Middleware
      name: reggiesbbq-staging-ipallowlist
      namespace: reggiesbbq-staging
      jsonPointers:
        - /spec/ipAllowList/sourceRange
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Pod Security `restricted`, matching prod. plane and environment as on
    # `staging` (Kyverno's business-plane policies key on plane).
    managedNamespaceMetadata:
      labels:
        environment: staging
        plane: business
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.34
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.34
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.34
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
