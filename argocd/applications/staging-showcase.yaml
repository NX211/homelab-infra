---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-showcase
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: showcase
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/NX211/homelab-infra.git
    targetRevision: HEAD
    path: staging-apps/showcase
  destination:
    server: https://kubernetes.default.svc
    # Own namespace, as on prod (X4 app parity). Moved before the chart changes,
    # so the namespace-wide policies of nextjs-app never meet the shared one.
    # The federated Pub/Sub publisher subject follows (platform-infra #4280).
    namespace: showcase-staging
  # The allowlist-reconciler owns this Middleware's sourceRange; ignore it so
  # selfHeal won't revert runtime writes.
  ignoreDifferences:
    - group: traefik.io
      kind: Middleware
      name: showcase-staging-ipallowlist
      namespace: showcase-staging
      jsonPointers:
        - /spec/ipAllowList/sourceRange
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Pod Security `restricted`, matching prod. plane and environment as on
    # `staging` (Kyverno's business-plane policies key on plane).
    managedNamespaceMetadata:
      labels:
        environment: staging
        plane: business
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.34
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.34
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.34
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
