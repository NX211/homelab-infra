---
# Per-tenant Tenant CRs, generated by the onboarding workflow (provisionOnboarding)
# and committed to provisioning/tenants/. Kept separate from the `provisioning`
# app (recurse:false, carries the CRD/controller/engine) so tenant data stays
# isolated from platform manifests. ArgoCD applies each CR → Metacontroller → the
# reconcile VO. Positive sync-wave so the CRD (wave -1) lands first.
#
# prune:false on purpose — decommission is spec-driven (set decommissioned:true in
# the committed CR to run the teardown saga), NOT file-deletion-driven, so an
# accidental file removal can never silently tear down a live client.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nx211/homelab-infra.git
    targetRevision: main
    path: provisioning/tenants
  destination:
    server: https://kubernetes.default.svc
    namespace: provisioning
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
