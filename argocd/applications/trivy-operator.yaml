---
# Trivy Operator (staging). Continuously scans workloads and publishes
# VulnerabilityReport / ConfigAuditReport CRs that Port ingests for the
# operational_readiness security signal. Mirrors the prod install in
# platform-infra. Concurrency is pinned to 1 scan job — staging is
# resource-constrained and reports accumulate fine at that pace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    # Server-side diff: the aquasecurity CRDs are large and apiserver
    # defaulting reads as false drift under client-side compare.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.36.0
    helm:
      valuesObject:
        # Only the namespaces feeding the Port scorecard signal; runtime
        # security is tetragon's job.
        targetNamespaces: "staging,provisioning"
        operator:
          scanJobsConcurrentLimit: 1
          # Rescan weekly, not the 24h default.
          scannerReportTTL: "168h"
          # Vulnerability reports are the only signal we consume; policy
          # compliance is kyverno's job.
          configAuditScannerEnabled: false
          rbacAssessmentScannerEnabled: false
          infraAssessmentScannerEnabled: false
          clusterComplianceEnabled: false
        trivyOperator:
          # The chart defaults this to true, telling trivy-operator to
          # authenticate to GCR/Artifact Registry via the GCP metadata server.
          # k3s has none, so the attempt cannot succeed — and taking that path
          # means it never falls back to the workload's imagePullSecrets. Scan
          # jobs were created with no credentials at all and every AR image
          # failed "DENIED: Unauthenticated request", which in a report is
          # indistinguishable from an image that simply cannot be scanned.
          #
          # Result: 407 VulnerabilityReports and not one for a pkg.dev image.
          # False makes it use the imagePullSecrets the workloads already carry
          # and ar-token-refresher keeps fresh; trivy-operator has RBAC to read
          # them and copies them into the scan namespace.
          #
          # Belongs to `trivyOperator`, NOT `operator` — #1089 put it under the
          # latter, where the chart never reads it, so the rendered ConfigMap
          # stayed scanJob.useGCRServiceAccount=true and nothing changed. The
          # value is only observable in the rendered ConfigMap, so `helm template`
          # is the check that matters, not whether Argo reports Synced.
          useGCRServiceAccount: false
          # Parity with prod: kyverno require-labels demands
          # app.kubernetes.io/name on every Pod (string form, not a map).
          scanJobPodTemplateLabels: "app.kubernetes.io/name=trivy-scan-job"
        # Controller pod resources (kyverno require-resource-limits parity
        # with prod, where the policy is enforced).
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        trivy:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
