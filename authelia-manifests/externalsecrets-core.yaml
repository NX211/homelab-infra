# Authelia core, database, OIDC and user secrets. Previously rendered by the
# helm-charts/authelia chart, which no Argo app deploys any more, so these
# ExternalSecrets ran unmanaged. Read from the Homelab Bitwarden project by ID.
---
# Database secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-database
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: authelia-database
    creationPolicy: Owner
  data:
    - secretKey: database
      remoteRef: { key: bbfed7f2-5549-43df-9de4-b3d00026bb2f }   # authelia-database
    - secretKey: database-user
      remoteRef: { key: 5cf25359-d7e3-417d-8f90-b3d00026f44e }   # authelia-database-user
    - secretKey: database-password
      remoteRef: { key: 44c8004c-8ead-496b-a2c1-b3d00026d422 }   # authelia-database-password
---
# Core Authelia secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: authelia-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef: { key: 3db0b5ec-3052-4b9a-8341-b3d000271ecb }   # authelia-jwt-secret
    - secretKey: session-secret
      remoteRef: { key: b579c714-77b2-40c8-a1ec-b3d00027f8b6 }   # authelia-session-secret
    - secretKey: encryption-key
      remoteRef: { key: 607e9135-8079-4445-82ce-b3dd004b16d7 }   # authelia-encryption-key
    - secretKey: session-default-name
      remoteRef: { key: 53e84acb-1932-4ed1-8df5-b3d00027b7f0 }   # authelia-session-default-name
    - secretKey: session-project-tld-name
      remoteRef: { key: 315e2708-98c0-4988-ab6a-b3d00027d6c5 }   # authelia-session-project-tld-name
---
# OIDC secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: authelia-oidc
    creationPolicy: Owner
  data:
    - secretKey: oidc-hmac-secret
      remoteRef: { key: a00f3968-d915-4d7d-87a0-b3d0002966cb }   # authelia-oidc-hmac-secret
    - secretKey: oidc-gitea-client-secret
      remoteRef: { key: c77ad456-b812-4cda-a346-b3d0002a5f18 }   # authelia-oidc-gitea-client-secret
    - secretKey: gitea-oidc-client-id
      remoteRef: { key: 4ce47f7a-49f6-4920-afc2-b3d0003a595b }   # gitea-oidc-client-id
---
# User configuration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: authelia-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users.yml: |
          users:
            {{ .user_1_username }}:
              displayname: "{{ .user_1_display_name }}"
              password: "{{ .user_1_password }}"
              email: {{ .user_1_email }}
              groups:
                - admin
                - media
                - print

            {{ .user_2_username }}:
              displayname: "{{ .user_2_display_name }}"
              password: "{{ .user_2_password }}"
              email: {{ .user_2_email }}
              groups:
                - media
                - print
  data:
    - secretKey: user_1_username
      remoteRef: { key: 5f2152f8-25d1-482a-ae0a-b3d0002868f6 }   # authelia-user-1-username
    - secretKey: user_1_display_name
      remoteRef: { key: a39c2fd4-6efc-4c7b-9c2a-b3d000280e26 }   # authelia-user-1-display-name
    - secretKey: user_1_password
      remoteRef: { key: 33283ebe-7b45-43c9-a4e2-b3d0002850d9 }   # authelia-user-1-password
    - secretKey: user_1_email
      remoteRef: { key: 20747765-bea0-4185-b9ae-b3d000283140 }   # authelia-user-1-email
    - secretKey: user_2_username
      remoteRef: { key: 7938417a-d061-4aff-8025-b3d000288333 }   # authelia-user-2-username
    - secretKey: user_2_display_name
      remoteRef: { key: 7ab29bc5-0465-4955-aa11-b3d0002896b4 }   # authelia-user-2-display-name
    - secretKey: user_2_password
      remoteRef: { key: 1ff2d264-4d91-4fca-b4ea-b3d00028b0ae }   # authelia-user-2-password
    - secretKey: user_2_email
      remoteRef: { key: 493fc425-23d6-43cb-aa2f-b3d00028d508 }   # authelia-user-2-email
