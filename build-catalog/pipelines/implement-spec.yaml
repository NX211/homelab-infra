              CPY
              }

              # Surface an agent run's outcome to the pipeline log — is_error,
              # turn count, result/subtype, and any stderr. Without this a
              # zero-turn failure (headless permission deny, auth, crashed CLI)
              # is invisible: stdout is the json file, stderr a /tmp file that
              # dies with the pod.
              agent_diag() { # $1 label  $2 out.json  $3 err.log
                python3 - "$1" "$2" <<'DPY' || true
              import json, sys
              label, path = sys.argv[1], sys.argv[2]
              try:
                  r = json.load(open(path))
                  print(f"  [{label}] is_error={r.get('is_error')} subtype={r.get('subtype')} "
                        f"turns={r.get('num_turns')} cost=${r.get('total_cost_usd',0)} "
                        f"api_error={r.get('api_error_status')}")
                  res = r.get("result")
                  if r.get("is_error") and res:
                      print(f"  [{label}] result: {str(res)[:500]}")
              except Exception as e:
                  print(f"  [{label}] no/invalid output json ({e}) — agent produced nothing")
              DPY
                if [ -s "$3" ]; then echo "  [$1] stderr tail:"; tail -n 8 "$3" | sed 's/^/    /'; fi
              }

              # --- confidence pre-flight (gate 6): implementable as specified? ---
              # A cheap read-only session (Bash and every mutation tool denied —
              # deny wins headless) scores whether the spec + demo + operator
              # instructions carry enough truth to build from WITHOUT inventing
              # facts or guessing requirements, BEFORE the expensive
              # builder/verifier loop burns tokens. Below threshold the run
              # PARKS with the blocking questions — a decision request, not a
              # defect (provenance status=parked). Degrades OPEN: a broken
              # pre-flight (agent error, unparseable verdict) must never park
              # real work — same rule as the fidelity checker. Skipped on
              # continuation runs: the PR exists, readiness was proven by the
