                cat > "${IMP}/preflight-settings.json" <<'PFSET'
              {
                "permissions": {
                  "deny": [
                    "Bash", "Edit", "Write", "NotebookEdit",
                    "Read(//var/run/anthropic/**)",
                    "WebFetch", "WebSearch"
                  ]
