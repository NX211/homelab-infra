              VPROMPT
              )" --permission-mode acceptEdits --settings "${IMP}/verifier-settings.json" \
                  --add-dir "${WS}" --max-turns 80 --output-format json \
                  > "${IMP}/verifier-out-$1.json" 2>/tmp/verifier-err.log || true
                agent_diag "verifier-$1" "${IMP}/verifier-out-$1.json" /tmp/verifier-err.log
                stop_app
                local post_hash; post_hash="$(tree_hash)"
                VERIFY_VERDICT="$(python3 - "${WS}" "$pre_hash" "$post_hash" <<'VPY'
              import json, os, sys
              ws, pre, post = sys.argv[1:4]
              path = f"{ws}/.implement/verify.json"
              out = {"verdict": "fail", "findings": [], "checked": []}
              if os.path.islink(path):
                  out["findings"].append({"severity": "blocker", "claim": "verify.json is a symlink", "evidence": "harness check"})
              elif os.path.isfile(path):
                  try:
                      raw = json.load(open(path))
                      fs = [f for f in raw.get("findings", [])
                            if isinstance(f, dict) and str(f.get("evidence", "")).strip()]
                      out["verdict"] = raw.get("verdict") if raw.get("verdict") in ("pass", "fail") else "fail"
                      out["findings"] = fs
                      out["checked"] = [str(c) for c in raw.get("checked", [])][:40]
                      # Per-requirement conformance (spec-format v2): evidence
                      # is mandatory per entry; any unmet requirement is a
                      # finding and fails the verdict regardless of what the
                      # verifier concluded overall.
                      reqs = [r for r in raw.get("requirements", [])
                              if isinstance(r, dict) and str(r.get("evidence", "")).strip()
                              and isinstance(r.get("id"), str)]
                      out["requirements"] = reqs[:100]
                      for r in reqs:
                          if r.get("met") is not True:
                              out["verdict"] = "fail"
                              out["findings"].append({"severity": "major",
                                  "claim": f"requirement {r['id']} unmet",
                                  "evidence": str(r.get("evidence", ""))[:300]})
                  except Exception as e:
                      out["findings"].append({"severity": "blocker", "claim": f"verify.json unreadable: {e}", "evidence": "harness check"})
              else:
                  out["findings"].append({"severity": "blocker", "claim": "verifier produced no verify.json", "evidence": "harness check"})
