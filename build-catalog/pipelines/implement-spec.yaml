                  # reverted and ends the loop — no oscillation, no wasted rounds.
                  if python3 -c 'import sys; raise SystemExit(0 if float(sys.argv[1]) > float(sys.argv[2]) else 1)' "$FIDELITY_SCORE" "$prev"; then
                    prev="$FIDELITY_SCORE"
                    cp "${IMP}/fidelity-$n.json" "${IMP}/fidelity-final.json"
                    [ "$FIDELITY_VERDICT" = pass ] && break
                  else
                    echo "style round $n did not improve (${FIDELITY_SCORE} <= ${prev}) — reverting, stopping"
                    git checkout -q -- . 2>/dev/null || true
                    git clean -qfd 2>/dev/null || true
                    break
                  fi
                  n=$((n+1))
                done
              }

              GATES_VERDICT=fail
              run_gates() {
                local lint=pass types=pass tests=pass spec=skip
                pnpm lint       > /tmp/g-lint.log  2>&1 || lint=fail
                pnpm type-check > /tmp/g-types.log 2>&1 || types=fail
                pnpm test -- --passWithNoTests > /tmp/g-test.log 2>&1 || tests=fail
                # REQ-to-test traceability (spec-format v2; self-skips legacy).
                if [ -f scripts/check-spec-traceability.mjs ]; then
                  spec=pass
