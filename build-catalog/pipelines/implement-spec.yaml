              Your FINAL message must be ONLY this JSON object — no prose, no
              code fences:
              {"confidence": <0-100>, "blockers": ["<what makes this unimplementable>"], "questions": ["<what to ask the operator>"]}
              PFPROMPT
              )" --permission-mode acceptEdits --settings "${IMP}/preflight-settings.json" \
                 --add-dir "${WS}" --max-turns 25 --output-format json \
                 > "${IMP}/preflight-out.json" 2>/tmp/preflight-err.log || true
                agent_diag "preflight" "${IMP}/preflight-out.json" /tmp/preflight-err.log
                PF_VERDICT="$(python3 - "${IMP}/preflight-out.json" <<'PFPY' || echo open
              import json, re, sys
