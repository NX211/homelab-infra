              import json, sys
              lint, types, tests, tf, spec, ws = sys.argv[1:7]
              base = json.load(open(f"{ws}/.implement/baseline.json"))
              ok = True
              # No worse than baseline: a gate may fail only if it already
              # failed before the agent touched anything.
              for k, v in (("lint", lint), ("typeCheck", types), ("tests", tests)):
                  if v == "fail" and base.get(k) == "pass":
                      ok = False
              # Deleting tests is the classic dodge — file count may not drop.
              if int(tf) < int(base.get("testFiles", 0)):
                  ok = False
              # Traceability is absolute, not baseline-relative: the agent owns
              # writing REQ-referencing tests for whatever it implements.
              if spec == "fail":
                  ok = False
              json.dump({"lint": lint, "typeCheck": types, "tests": tests,
                         "specTraceability": spec,
                         "testFiles": int(tf), "verdict": "pass" if ok else "fail"},
                        open(f"{ws}/.implement/gates.json", "w"))
              print("pass" if ok else "fail")
              GPY
              )"
                echo "gates: ${GATES_VERDICT} ($(cat "${IMP}/gates.json"))"
              }

              APP_PID=""
              BOOT_OK=false
              boot_app() {
                BOOT_OK=false
                # Boot in DEV mode (next dev), not a production build+start.
                # Two reasons: (1) `next start` runs NODE_ENV=production, which
                # trips an app's prod-only env validation (Stripe/Shippo/etc.
                # keys we deliberately do not hold) — dev mode is NODE_ENV
                # development and skips that gate, so a real app actually boots
                # for live verification; (2) no build step, so boot is faster.
                # A single-package app runs at the root; the app-template
                # monorepo runs the web workspace — cd into it so `next` is the
                # local one. Turbopack off (--turbo can flake headless); dev
                # compiles routes on first request, so allow a long warmup.
                local webdir=.
                [ -d apps/web ] && webdir=apps/web
                ( cd "$webdir" && PORT=3000 pnpm exec next dev -p 3000 > /tmp/boot-run.log 2>&1 & echo $! > /tmp/app.pid ) || true
                APP_PID="$(cat /tmp/app.pid 2>/dev/null || true)"
                for i in $(seq 1 75); do
                  if curl -sf -o /dev/null "http://127.0.0.1:3000/api/health"; then BOOT_OK=true; break; fi
                  sleep 2
                done
                $BOOT_OK && echo "app booted in dev mode (health OK)" || { echo "app did not become healthy (tail):"; tail -n 20 /tmp/boot-run.log; }
              }
              stop_app() {
                [ -n "${APP_PID}" ] && kill "${APP_PID}" >/dev/null 2>&1 || true
                pkill -f "next-server" >/dev/null 2>&1 || true
                pkill -f "next start"  >/dev/null 2>&1 || true
                APP_PID=""
              }

