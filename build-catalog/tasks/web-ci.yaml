---
# Reusable catalog Task: untrusted web/nextjs PR checks. Faithful to capturly
# ci.yml (lint-and-typecheck + build): install via the Verdaccio proxy (NO npm
# token in the pod), build dependent packages, lint, type-check, then build+test
# the web app. Zero secrets; runs under gVisor (set on the PipelineRun).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: web-ci
  labels:
    app.kubernetes.io/part-of: build-catalog
spec:
  params:
    - name: node-image
      type: string
      # Node+pnpm pre-baked (apps/build-web-toolchain) so the step runs non-root
      # (no `corepack enable` write to /usr/local). Digest pinned by CI.
      default: ghcr.io/nx211/build-web-toolchain:0.5.0@sha256:c9189954dc42c2a65ce250fb9a876f77f18c2ec3860b10ccb83f100858b09ba9
  workspaces:
    - name: source
    - name: npmrc # configmap: .npmrc pointing at Verdaccio (no token)
      mountPath: /config/npm
  steps:
    - name: checks
      image: $(params.node-image)
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: $(workspaces.source.path)
        # Turbo/CI hints; no secrets.
        - name: CI
          value: "true"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # pnpm is baked into the image (non-root); no corepack enable needed.
        # APPEND the Verdaccio registry — do NOT overwrite. HOME is the repo root,
        # so `cp` would clobber the repo's committed .npmrc, which sets
        # node-linker=hoisted. That setting is required: it hoists @types/node into
        # the root node_modules where every package's tsc finds Node globals
        # (Buffer/setTimeout). Overwriting it broke every package's build offline.
        cat /config/npm/.npmrc >> "$HOME/.npmrc"   # registry = Verdaccio, no auth
        pnpm install --frozen-lockfile
        # apps/web type-checks against the compiled dist/ of its workspace deps.
        pnpm --filter "@capturly/web^..." --if-present build
        pnpm run lint --filter='!@capturly/mobile'
        pnpm run type-check --filter='!@capturly/mobile'
        # Build + unit-test the web app.
        pnpm --filter "@capturly/web" --if-present build
        pnpm --filter "@capturly/web" --if-present test
