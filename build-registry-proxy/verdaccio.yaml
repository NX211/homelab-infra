---
# Verdaccio npm registry proxies — TWO instances so the trusted and untrusted
# build tiers share NO cache (H3). Each holds the read token (uplink to npmjs) and
# serves private @corey-alan-consulting packages anonymously in-cluster, so build
# pods hold no npm credential. Shared config; separate deployments, each with
# its OWN persistent cache; a tier can only reach its own proxy (per-tier
# ingress netpol).
#
# Uplink tuning, 2026-11-13: Verdaccio's defaults (30s timeout, offline after 2
# failures, for 5m) turned npmjs slowness into 404s. Two timeouts while the
# untrusted cache refilled marked the uplink offline, and every uncached
# tarball then answered 404 (capturly.app#600: compare-version-0.1.2.tgz, which
# npm served fine). 46 upstream timeouts in 24h on untrusted, 0 on trusted.
# The cache was emptyDir, so every restart (Reloader on each token rotation)
# re-fetched ~1.6G under build load. It is now a PVC per tier.
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdaccio-config
  namespace: build-registry-proxy
data:
  config.yaml: |
    storage: /verdaccio/storage
    auth:
      htpasswd:
        file: /verdaccio/storage/htpasswd
        max_users: -1
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        auth:
          type: bearer
          token_env: NPM_TOKEN
        maxage: 10m
        timeout: 60s
        max_fails: 5
        fail_timeout: 1m
        agent_options: { keepAlive: true, maxSockets: 40, maxFreeSockets: 10 }
    packages:
      '@corey-alan-consulting/*':
        access: $anonymous
        publish: $authenticated
        proxy: npmjs
      '**':
        access: $anonymous
        publish: $authenticated
        proxy: npmjs
    server:
      keepAliveTimeout: 60
    log: { type: stdout, format: pretty, level: warn }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio-untrusted
  namespace: build-registry-proxy
  labels: { app: verdaccio-untrusted, app.kubernetes.io/name: verdaccio }
  # NPM_TOKEN is read at pod start; restart when the uplink secret rotates.
  annotations: { reloader.stakater.com/auto: "true" }
spec:
  replicas: 1
  # RWO local-path volume: the old pod must release it before the new one starts.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: verdaccio-untrusted }
  template:
    metadata:
      labels: { app: verdaccio-untrusted, app.kubernetes.io/name: verdaccio }
      # Bumped to roll the pods onto a rotated uplink token.
      annotations: { build-registry-proxy/npm-uplink-rotated: "2026-11-01" }
    spec:
      enableServiceLinks: false     # avoid VERDACCIO_PORT=tcp://... injection
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: verdaccio
          image: verdaccio/verdaccio:7.1.0
          ports: [{ containerPort: 4873, name: http }]
          env:
            - { name: VERDACCIO_PORT, value: "4873" }
            # Node caps old-space ~256MB by default; installs OOM'd the pod.
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
            - name: NPM_TOKEN
              valueFrom: { secretKeyRef: { name: verdaccio-npm-uplink, key: npm-token } }
          volumeMounts:
            - { name: config, mountPath: /verdaccio/conf }
            - { name: storage, mountPath: /verdaccio/storage }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /-/ping, port: 4873 }
            initialDelaySeconds: 5
      volumes:
        - { name: config, configMap: { name: verdaccio-config } }
        - { name: storage, persistentVolumeClaim: { claimName: verdaccio-untrusted-storage } }
---
apiVersion: v1
kind: Service
metadata:
  name: verdaccio-untrusted
  namespace: build-registry-proxy
spec:
  selector: { app: verdaccio-untrusted }
  ports: [{ port: 4873, targetPort: 4873, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio-trusted
  namespace: build-registry-proxy
  labels: { app: verdaccio-trusted, app.kubernetes.io/name: verdaccio }
  # NPM_TOKEN is read at pod start; restart when the uplink secret rotates.
  annotations: { reloader.stakater.com/auto: "true" }
spec:
  replicas: 1
  # RWO local-path volume: the old pod must release it before the new one starts.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: verdaccio-trusted }
  template:
    metadata:
      labels: { app: verdaccio-trusted, app.kubernetes.io/name: verdaccio }
      # Bumped to roll the pods onto a rotated uplink token.
      annotations: { build-registry-proxy/npm-uplink-rotated: "2026-11-01" }
    spec:
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: verdaccio
          image: verdaccio/verdaccio:7.1.0
          ports: [{ containerPort: 4873, name: http }]
          env:
            - { name: VERDACCIO_PORT, value: "4873" }
            # Node caps old-space ~256MB by default; installs OOM'd the pod.
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
            - name: NPM_TOKEN
              valueFrom: { secretKeyRef: { name: verdaccio-npm-uplink, key: npm-token } }
          volumeMounts:
            - { name: config, mountPath: /verdaccio/conf }
            - { name: storage, mountPath: /verdaccio/storage }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /-/ping, port: 4873 }
            initialDelaySeconds: 5
      volumes:
        - { name: config, configMap: { name: verdaccio-config } }
        - { name: storage, persistentVolumeClaim: { claimName: verdaccio-trusted-storage } }
---
apiVersion: v1
kind: Service
metadata:
  name: verdaccio-trusted
  namespace: build-registry-proxy
spec:
  selector: { app: verdaccio-trusted }
  ports: [{ port: 4873, targetPort: 4873, name: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdaccio-untrusted-storage
  namespace: build-registry-proxy
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 15Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdaccio-trusted-storage
  namespace: build-registry-proxy
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
