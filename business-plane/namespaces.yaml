---
# The "business plane" — namespaces that carry SOC-2-in-scope workloads (the build
# fleet today; extend the label to other business namespaces later). Labeling them
# `plane: business` is what the NetworkPolicies and namespace-scoped Kyverno
# policies select on, so the personal self-hosted services (media stack, etc.)
# stay outside the boundary and cannot reach in.
#
# Pod Security is set to AUDIT/WARN restricted (observe) — not enforce — so we can
# see violations before turning the gate on.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    plane: business
    # ARC-managed pods can't satisfy 'restricted': the ephemeral runners
    # apt-install at job time (playwright install --with-deps) and the ARC
    # listener pod sets no securityContext. Baseline is the level ARC documents
    # for its namespaces. These are TRUSTED first-party smoke runners; the
    # untrusted build lane keeps gVisor + restricted separately via Tekton.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    plane: business
    # ARC-managed pods can't satisfy 'restricted': the ephemeral runners
    # apt-install at job time (playwright install --with-deps) and the ARC
    # listener pod sets no securityContext. Baseline is the level ARC documents
    # for its namespaces. These are TRUSTED first-party smoke runners; the
    # untrusted build lane keeps gVisor + restricted separately via Tekton.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# staging joins the plane (design §8.1). It was outside the boundary every
# NetworkPolicy and namespace-scoped Kyverno policy selects on, which is the
# whole point of the label.
#
# It is declared here rather than in staging/namespace.yaml because that file is
# shipped by no ArgoCD Application -- the live namespace was created by a bare
# `kubectl apply` and carries no labels at all, so editing it would have changed
# nothing. Declaring it alongside its siblings makes the boundary authoritative
# and leaves one source of truth.
#
# No Pod Security level is set. arc-* pin baseline for reasons specific to ARC
# runners; the staging apps have not been assessed against a level yet, and
# guessing one here would either be theatre or an outage. That assessment is
# tracked with the Phase 0 work, not smuggled in with a label.
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  annotations:
    # The business-plane app syncs with prune: true. Seven staging-apps/*
    # Applications deploy into this namespace, so dropping it from this file --
    # a one-line edit -- would otherwise delete the namespace and everything
    # those apps run in it. Removing staging from the plane should be a
    # deliberate manual act, not a side effect of a diff.
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    plane: business
    environment: staging
