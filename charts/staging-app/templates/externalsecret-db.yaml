---
{{- if .Values.database.enabled }}
{{- if .Values.database.superuser.create }}
# Postgres superuser password (shared across staging apps — only one app should create this)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser-staging
  labels:
    {{- include "staging-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: postgres-superuser-staging
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres-root-password
        property: value
{{- end }}
---
# App-specific database credentials (from Bitwarden staging project)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "staging-app.databaseSecretName" . }}
  labels:
    {{- include "staging-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "staging-app.secretStoreName" . }}
    kind: ClusterSecretStore
  target:
    name: {{ include "staging-app.databaseSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.database.userKey }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.passwordKey }}
    - secretKey: dbname
      remoteRef:
        key: {{ .Values.database.nameKey }}
{{- end }}
