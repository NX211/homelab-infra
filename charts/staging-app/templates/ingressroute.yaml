---
{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "staging-app.fullname" . }}
  labels:
    {{- include "staging-app.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ .Values.ingress.host }}`)
    kind: Rule
    services:
    - name: {{ include "staging-app.fullname" . }}
      port: {{ .Values.service.port }}
    {{- if .Values.ingress.ipAllowList.enabled }}
    middlewares:
    - name: {{ include "staging-app.fullname" . }}-ipallowlist
    {{- end }}
  tls:
    secretName: {{ include "staging-app.fullname" . }}-tls
{{- end }}
