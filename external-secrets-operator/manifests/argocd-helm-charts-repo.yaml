# Argo CD's credential for the OCI Helm chart registry (shared charts such as
# nextjs-app, published by platform-infra publish-charts.yml). Argo reads any
# Secret labelled secret-type=repository; ESO copies the current Artifact
# Registry token into it every 10m (artifact-registry-generator.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helm-charts-repo
  namespace: argocd
spec:
  refreshInterval: 10m
  target:
    name: repo-helm-charts
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: helm-charts
        type: helm
        enableOCI: "true"
        url: us-central1-docker.pkg.dev/platform-infra-prod/helm-charts
        username: "{{ .username }}"
        password: "{{ .password }}"
  secretStoreRef:
    kind: ClusterSecretStore
    name: artifact-registry-token
  data:
    - secretKey: username
      remoteRef:
        key: artifact-registry-token
        property: username
    - secretKey: password
      remoteRef:
        key: artifact-registry-token
        property: password
