---
# ClusterSecretStore for Bitwarden Secrets Manager
# This allows all namespaces to pull secrets from Bitwarden
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secrets-manager
spec:
  provider:
    bitwardensecretsmanager:
      auth:
        secretRef:
          credentials:
            name: bitwarden-credentials
            namespace: external-secrets-system
            key: token
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets-system.svc.cluster.local:9998
      organizationID: "4650c1c8-8d22-4073-8a7d-b3cf011d5ff2"
      projectID: "634e7fc0-13a9-49fc-9a70-b50c00475190"
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets-system
        key: ca.crt
