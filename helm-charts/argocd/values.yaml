# ArgoCD Helm Chart Configuration
# Wraps the official argo-cd chart for homelab k3s cluster

# Ingress configuration (managed by this wrapper chart)
ingress:
  enabled: true
  host: cd.authoritah.com
  clusterIssuer: letsencrypt-prod

argo-cd:
  # Global settings
  global:
    domain: cd.authoritah.com

  # Configuration
  configs:
    cm:
      # Repository timeout
      timeout.reconciliation: 180s
      # Enable API key generation for admin account
      accounts.admin: apiKey, login
      # Read-only account for the Port Ocean ArgoCD integration (token minted for
      # it, stored via ESO). Granted role:readonly below — never admin.
      accounts.port-ocean-user: apiKey
      # Argo ships no built-in health assessment for the CloudNativePG Cluster
      # CR, so the `postgresql` app perpetually reported "Unknown" health even
      # while the database was up. This Lua check reads the CR's `Ready`
      # condition so the app reflects real state (Healthy/Degraded).
      resource.customizations.health.postgresql.cnpg.io_Cluster: |
        local hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            end
            if condition.type == "Ready" and condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for CloudNativePG cluster to report Ready"
        return hs
      # Argo's built-in PVC check reports Pending as Progressing and does not
      # honour WaitForFirstConsumer, so a local-path PVC (the cluster's only SC,
      # WFFC) that legitimately waits for its first consumer pins the owning app
      # in Progressing forever (e.g. the gradle-cache on a build namespace before
      # any build runs). Treat a Pending local-path PVC as Healthy; leave every
      # other state at Argo's default assessment.
      resource.customizations.health.PersistentVolumeClaim: |
        local hs = {}
        if obj.status ~= nil and obj.status.phase == "Pending"
           and obj.spec.storageClassName == "local-path" then
          hs.status = "Healthy"
          hs.message = "WaitForFirstConsumer: binds on first consumer"
          return hs
        end
        if obj.status ~= nil and obj.status.phase == "Bound" then
          hs.status = "Healthy"
          return hs
        end
        if obj.status ~= nil and obj.status.phase == "Lost" then
          hs.status = "Degraded"
          hs.message = "PVC lost its bound volume"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for PVC to bind"
        return hs
      # Server-side defaulting that Argo flags as drift on healthy apps. Each
      # entry suppresses ONLY cosmetic diffs (ignoreDifferences can never create
      # drift), keyed by the SSA field manager that owns the defaulted fields
      # where possible so it stays comprehensive as the objects evolve.
      #
      # ESO writes remoteRef.{conversion,decoding}Strategy / metadataPolicy /
      # nullBytePolicy, target.deletionPolicy, template.mergePolicy on every
      # ExternalSecret (build-registry-proxy, tekton-pac, the build fleet).
      resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
        managedFieldsManagers:
          - external-secrets
      # Kyverno's controller defaults admission/emitWarning and writes
      # status.autogen back onto every ClusterPolicy (kyverno-policies*).
      resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
        managedFieldsManagers:
          - kyverno
      # CRDs: charts render spec.preserveUnknownFields:false and an empty
      # metadata.labels:{} that the apiserver drops (tekton-operator,
      # manual-approval-gate, kyverno); these are not manager-tracked, so ignore
      # the paths. (Server-Side Diff above already handles this natively; kept as a
      # fallback and to also cover cert-manager cainjector caBundle churn.)
      resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        jsonPointers:
          - /spec/preserveUnknownFields
          - /metadata/labels
          - /spec/conversion/webhook/clientConfig/caBundle
      # The Job controller injects immutable batch.kubernetes.io/controller-uid
      # selector + template labels (kyverno-migrate-resources).
      resource.customizations.ignoreDifferences.batch_Job: |
        jqPathExpressions:
          - .spec.selector
          - .spec.template.metadata.labels

    rbac:
      # Grant the Port integration account read-only access (admin stays admin;
      # no policy.default change so other accounts are unaffected).
      policy.csv: |
        g, port-ocean-user, role:readonly

    params:
      # Run server without TLS (Traefik handles TLS termination)
      server.insecure: true
      # NB: Server-Side Diff is scoped per-app (argocd.argoproj.io/compare-options:
      # ServerSideDiff=true) on the build/tekton/kyverno apps that need it — NOT
      # enabled globally, because cluster-wide SSD surfaced a false OutOfSync on
      # traefik's Service/IngressClass (server-allocated fields) and selfHeal then
      # thrashed it. Keep the blast radius to the apps whose drift we understand.

  # Application Controller - manages application state
  #
  # Sized from observed behaviour, not a guess. At the previous 2Gi limit the
  # controller sat in a CrashLoopBackOff of OOMKills (exit 137), getting ~60s
  # per life -- never long enough to finish a reconcile, so apps stayed
  # OutOfSync and manual syncs only added work it could not complete.
  #
  # It caches the whole cluster: ~1250 workload resources, 194 CRDs, ~800
  # secrets, 41 namespaces, across 96 Applications. Run briefly at a 4Gi limit
  # it peaked at 3112Mi with zero restarts and drained the backlog from 43
  # OutOfSync to 10 in about two minutes. 6Gi keeps roughly 2x the observed
  # peak, since `kubectl top` samples too coarsely to catch the real high-water
  # mark and the cluster only grows.
  #
  # CPU was pinned at 966m against the old 1000m limit -- hard throttled, which
  # stretches every reconcile and keeps memory resident longer.
  #
  # yellowtalon, where this runs, has 32 cores and 64Gi with ~10% of memory
  # requested, so this is not a scarce resource here.
  controller:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 6Gi

  # API Server - UI and API endpoint
  server:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Run in insecure mode since Traefik handles TLS termination
    extraArgs:
      - --insecure

    # Ingress handled by wrapper chart templates (certificate.yaml + ingressroute.yaml)
    ingress:
      enabled: false

  # Repo Server - clones and renders manifests
  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  # ApplicationSet Controller - manages ApplicationSets
  applicationSet:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Notifications Controller - sends notifications
  notifications:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # No notifiers are configured. The previous on-staging-deployed ->
    # gitops-trigger /promote webhook path was retired when promotion moved
    # to the staging-promote.yml -> platform-infra staging/ok check_run
    # chain; its notifier/template/trigger and the promote-token
    # ExternalSecret were removed with it.
    secret:
      create: false

  # Dex - OAuth/SSO (disabled, using Authelia instead)
  dex:
    enabled: false

  # Redis - caching
  redis:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Disable high availability components (homelab doesn't need HA)
  redis-ha:
    enabled: false
