---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bazarr.fullname" . }}
  labels:
    {{- include "bazarr.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bazarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bazarr.selectorLabels" . | nindent 8 }}
    spec:
      # RuntimeDefault seccomp for every container in the pod.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: fix-permissions
        image: busybox:1.38.0
        command:
        - sh
        - -c
        - |
          chown -R {{ .Values.env.PUID }}:{{ .Values.env.PGID }} /config
        securityContext:
          allowPrivilegeEscalation: false
          # Only the mounted volume is written to.
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config
      containers:
      - name: bazarr
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        - name: TZ
          value: {{ .Values.env.TZ | quote }}
        - name: PUID
          value: {{ .Values.env.PUID | quote }}
        - name: PGID
          value: {{ .Values.env.PGID | quote }}
        # Bazarr 1.6.0 migrates its database on first start and then works for
        # about nine and a half minutes before it serves HTTP. Measured on this
        # cluster: ready at 9m21s. The old liveness probe (60s delay, 5 failures
        # at 30s) killed it at ~210s every time, so the work restarted from
        # scratch and never finished -- 11 restarts over 51 minutes.
        #
        # While a startupProbe is running, liveness and readiness are suspended,
        # so this allows up to 15 minutes for a slow start before liveness takes
        # over with its normal thresholds.
        #
        # Do not "fix" this by rolling the image back. 1.6.0's migration is
        # one-way: on 1.5.6 the database now fails with
        #   flask_migrate ERROR: Can't locate revision identified by '7e9a2b1c4d5f'
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 90
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
        {{- if .Values.persistence.media.enabled }}
        - name: movies
          mountPath: {{ .Values.persistence.media.movies.mountPath }}
        - name: tv
          mountPath: {{ .Values.persistence.media.tv.mountPath }}
        - name: kids
          mountPath: {{ .Values.persistence.media.kids.mountPath }}
        - name: anime
          mountPath: {{ .Values.persistence.media.anime.mountPath }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: {{ include "bazarr.fullname" . }}-config
      {{- if .Values.persistence.media.enabled }}
      - name: movies
        hostPath:
          path: {{ .Values.persistence.media.movies.hostPath }}
          type: Directory
      - name: tv
        hostPath:
          path: {{ .Values.persistence.media.tv.hostPath }}
          type: Directory
      - name: kids
        hostPath:
          path: {{ .Values.persistence.media.kids.hostPath }}
          type: Directory
      - name: anime
        hostPath:
          path: {{ .Values.persistence.media.anime.hostPath }}
          type: Directory
      {{- end }}
