---
# Gitea database credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-database
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gitea-database
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef: { key: 63ba9755-4712-465a-a16a-b3d00039f0d4 }   # gitea-database
    - secretKey: user
      remoteRef: { key: deefbdb0-af96-448d-a4e0-b3d00039c62a }   # gitea-database-user
    - secretKey: password
      remoteRef: { key: cbd337f8-7d99-48c5-bf76-b3d00039db9d }   # gitea-database-password
---
# Gitea security tokens
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-security
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gitea-security
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef: { key: 066d9c76-41b9-423c-a41d-b3f7016b3d84 }   # gitea-secret-key
    - secretKey: internal-token
      remoteRef: { key: 43a0fb11-a2f5-4886-8286-b3f7016b6c0d }   # gitea-internal-token
    - secretKey: lfs-jwt-secret
      remoteRef: { key: d2151950-6d7b-4c86-8dc3-b3f7016bc051 }   # gitea-lfs-jwt-secret
    - secretKey: cookie-name
      remoteRef: { key: 57dd0ed7-32a3-4f8e-b2e3-b3d00039aa8c }   # gitea-cookie-name
---
# Gitea OAuth2 credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oauth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gitea-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: 4ce47f7a-49f6-4920-afc2-b3d0003a595b }   # gitea-oidc-client-id
    - secretKey: client-secret
      remoteRef: { key: 36586f38-08b0-4c32-b22c-b3d0003a7314 }   # gitea-oidc-client-secret
---
# Email credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-email
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gitea-email
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef: { key: 4396cf75-3185-438f-b48f-b3d0002ee5ab }   # email-host
    - secretKey: user
      remoteRef: { key: 87b52230-a438-44a6-a309-b3d0002f443c }   # email-user
    - secretKey: password
      remoteRef: { key: 8e0024d8-888b-4491-a46f-b3d0002f15d4 }   # email-password
