---
{{- if .Values.chrome.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karakeeper.fullname" . }}-chrome
  labels:
    {{- include "karakeeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: chrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "karakeeper.name" . }}-chrome
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "karakeeper.name" . }}-chrome
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: chrome
        image: "{{ .Values.chrome.image.repository }}:{{ .Values.chrome.image.tag }}"
        imagePullPolicy: {{ .Values.chrome.image.pullPolicy }}
        ports:
        - name: debug
          containerPort: {{ .Values.chrome.service.port }}
          protocol: TCP
        # Upstream's argument set. The entrypoint already supplies
        # --no-sandbox and binds remote debugging itself, forwarding container
        # port 9222; passing --remote-debugging-address/-port here conflicts
        # with that forwarding and breaks the browser.
        args:
        - --disable-gpu
        - --disable-dev-shm-usage
        - --hide-scrollbars
        - --disable-blink-features=AutomationControlled
        - --window-size=1440,900
        resources:
          {{- toYaml .Values.chrome.resources | nindent 10 }}
{{- end }}
