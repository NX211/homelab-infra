---
# SeaweedFS S3 credentials for the synapse-s3-storage-provider (scoped `synapse`
# identity, read/write/list on the synapse-media bucket only). Consumed as
# boto3 env vars by the media worker (and main) — keys never enter the ConfigMap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: matrix-synapse-s3
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef: { key: 108bc7c1-d46a-44c8-93d3-b4700007b7e1 }   # synapse-s3-access-key
    - secretKey: secret-access-key
      remoteRef: { key: 1d1afc39-c40d-4a3e-a7bc-b4700007b827 }   # synapse-s3-secret-key
