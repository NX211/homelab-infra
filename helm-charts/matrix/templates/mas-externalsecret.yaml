{{- if .Values.mas.enabled }}
---
# MAS secret material. Assembled from Bitwarden via ESO. Mounted at /secrets in
# the MAS pod; config.yaml references these by file path, and db.yaml is merged
# as a second --config file (carries the DB password out of the ConfigMap).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.mas.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mas.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        encryption: {{ `"{{ .encryption }}"` }}
        rsa.pem: {{ `"{{ .rsa }}"` }}
        ec.pem: {{ `"{{ .ec }}"` }}
        google-client-secret: {{ `"{{ .googleSecret }}"` }}
        synapse-shared-secret: {{ `"{{ .sharedSecret }}"` }}
        db.yaml: |
          database:
            host: matrix-postgres-rw.{{ .Release.Namespace }}.svc.cluster.local
            port: 5432
            username: {{ .Values.databases.mas.user }}
            password: {{ `"{{ .dbPassword }}"` }}
            database: {{ .Values.databases.mas.name }}
  data:
    - secretKey: encryption
      remoteRef: { key: 430242c3-0dc2-4978-86dd-b4700002c1a8 }   # mas-encryption-secret
    - secretKey: rsa
      remoteRef: { key: a8fb8e8e-defd-4902-b64b-b4700002eba9 }   # mas-signing-key-rsa
    - secretKey: ec
      remoteRef: { key: 3dbf9f15-9fa1-490c-9b87-b4700002ec8a }   # mas-signing-key-ec
    - secretKey: googleSecret
      remoteRef: { key: 97a10639-45e0-4a0d-bae8-b4700002c27b }   # google-oauth-client-secret
    - secretKey: sharedSecret
      remoteRef: { key: 94375a59-c8fe-4858-89e7-b4700002c1ed }   # synapse-mas-shared-secret
    - secretKey: dbPassword
      remoteRef: { key: 7bbcb1c0-f4b6-4f64-84e2-b46f0186b06d }   # mas-db-password
---
# The same Synapse<->MAS shared secret, exposed to the Synapse pod for
# matrix_authentication_service.secret_path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-mas
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: matrix-synapse-mas
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        shared-secret: {{ `"{{ .sharedSecret }}"` }}
  data:
    - secretKey: sharedSecret
      remoteRef: { key: 94375a59-c8fe-4858-89e7-b4700002c1ed }   # synapse-mas-shared-secret
{{- end }}
