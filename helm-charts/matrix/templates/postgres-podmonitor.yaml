{{- if .Values.postgres.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: matrix-postgres-metrics
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: matrix-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
{{- end }}
