---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.instances }}
  # Single instance on node-local storage: a PodDisruptionBudget can only
  # block the node's drain (k3s upgrades), never keep Postgres up. Without one
  # the drain evicts the pod and it restarts on the same PVC once the node is
  # back, which CloudNativePG recommends for staging over toggling
  # nodeMaintenanceWindow by hand.
  enablePDB: false

  # PostgreSQL configuration
  imageName: {{ .Values.imageName }}

  postgresql:
    parameters:
      {{- range $key, $value := .Values.postgresql.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}

  # Storage configuration
  storage:
    size: {{ .Values.storage.size }}
    storageClass: {{ .Values.storage.storageClass }}

  # Allow CNPG to manage the postgres superuser password.
  # When the superuserSecret changes, CNPG will ALTER USER postgres PASSWORD automatically.
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: {{ .Values.bootstrap.initdb.database }}
      owner: {{ .Values.bootstrap.initdb.owner }}
      {{- if .Values.bootstrap.initdb.postInitApplicationSQL }}
      postInitApplicationSQL:
        {{- toYaml .Values.bootstrap.initdb.postInitApplicationSQL | nindent 8 }}
      {{- end }}

  {{- if .Values.backup.enabled }}
  # Automated backups
  backup:
    barmanObjectStore:
      {{- toYaml .Values.backup.barmanObjectStore | nindent 6 }}
    retentionPolicy: {{ .Values.backup.retentionPolicy | default "30d" }}
  {{- end }}

  # Node affinity
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            {{- range $key, $value := .Values.nodeSelector }}
            - {{ $value }}
            {{- end }}

  # Resources
  resources:
    {{- toYaml .Values.resources | nindent 4 }}

