# Prowlarr Helm Chart Values

# Image configuration
image:
  repository: ghcr.io/linuxserver/prowlarr
  tag: "2.6.5.5623-ls163"
  pullPolicy: IfNotPresent

# Service configuration
service:
  port: 9696

# Ingress configuration
ingress:
  enabled: true
  host: prowlarr.authoritah.tv
  clusterIssuer: letsencrypt-prod

# Node selection
nodeSelector:
  kubernetes.io/hostname: blacktalon

# Persistence
persistence:
  config:
    enabled: true
    size: 2Gi
    storageClass: local-path

# The UI sits behind Authelia forward-auth (IngressRoute middleware), so the app
# trusts it instead of showing its own login form. Current releases refuse the
# local-address bypass for any request carrying X-Forwarded-For, which Traefik
# always adds, so "Forms + disabled for local addresses" now means a second
# login after Authelia. API routes still require the API key either way, so the
# Authelia /api bypass stays key-protected. Allowed Hosts is the ingress host plus
# the in-cluster service names that Prowlarr/Seerr/Bazarr use; loopback and the pod
# hostname are always accepted.
auth:
  external: true

# Environment variables
env:
  TZ: America/New_York
  PUID: "8675309"  # media user
  PGID: "8675309"  # media group

# Byparr sidecar (FlareSolverr-compatible /v1 API)
byparr:
  enabled: true
  image:
    repository: ghcr.io/thephaseless/byparr
    # Upstream publishes only :latest (no semver tags), so pin by digest for
    # reproducible deploys. digest takes precedence over tag in the template.
    tag: "latest"
    digest: "sha256:01a46a2865d9a6db5eb8ead04ec0dd33b8fbe233e8565ae70b50d4cc0af4cfb0"
    pullPolicy: IfNotPresent
  service:
    port: 8191
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

# External Secrets (optional - if using ESO)
externalSecrets:
  enabled: false
  # secretName: prowlarr-secrets
  # refreshInterval: 1h
  # secrets:
  #   - name: PROWLARR_API_KEY
  #     key: prowlarr-api-key

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
