# Radarr Helm Chart Values

# Image configuration
image:
  repository: lscr.io/linuxserver/radarr
  tag: "6.4.4.10685-ls324"
  pullPolicy: IfNotPresent

# Service configuration
service:
  port: 7878

# Ingress configuration
ingress:
  enabled: true
  host: radarr.authoritah.tv
  clusterIssuer: letsencrypt-prod

# Node selection
nodeSelector:
  kubernetes.io/hostname: blacktalon

# Persistence
persistence:
  config:
    enabled: true
    size: 5Gi
    storageClass: local-path

  # Media directories (hostPath for large libraries)
  media:
    enabled: true
    movies:
      hostPath: /blacktalon/media/movies
      mountPath: /media/movies
    kids:
      hostPath: /blacktalon/media/kids
      mountPath: /media/kids
    downloadsMovies:
      hostPath: /blacktalon/media/downloads/movies
      mountPath: /media/downloads/movies
    downloadsKids:
      hostPath: /blacktalon/media/downloads/kids
      mountPath: /media/downloads/kids

# The UI sits behind Authelia forward-auth (IngressRoute middleware), so the app
# trusts it instead of showing its own login form. Current releases refuse the
# local-address bypass for any request carrying X-Forwarded-For, which Traefik
# always adds, so "Forms + disabled for local addresses" now means a second
# login after Authelia. API routes still require the API key either way, so the
# Authelia /api bypass stays key-protected. Allowed Hosts is the ingress host plus
# the in-cluster service names that Prowlarr/Seerr/Bazarr use; loopback and the pod
# hostname are always accepted.
auth:
  external: true

# Environment variables
env:
  TZ: America/New_York
  PUID: "8675309"  # media user
  PGID: "8675309"  # media group

# External Secrets (optional - if using ESO)
externalSecrets:
  enabled: false
  # secretName: radarr-secrets
  # refreshInterval: 1h
  # secrets:
  #   - name: RADARR_API_KEY
  #     key: radarr-api-key

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
