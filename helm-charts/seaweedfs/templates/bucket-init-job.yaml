---
{{- if .Values.buckets }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "seaweedfs.fullname" . }}-bucket-init
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: bucket-init
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "seaweedfs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bucket-init
    spec:
      # RuntimeDefault seccomp for every container in the pod.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: bucket-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for filer to become ready..."
              until wget -q -O- "http://{{ include "seaweedfs.fullname" . }}-filer:{{ .Values.filer.port }}/healthz" >/dev/null 2>&1; do
                sleep 2
              done
              # s3.bucket.create fails on a bucket that already exists, so
              # create only the missing ones; otherwise every sync after the
              # first fails this hook.
              master="{{ include "seaweedfs.fullname" . }}-master:{{ .Values.master.port }}"
              existing="$(echo s3.bucket.list | weed shell -master="$master" | awk '{print $1}')"
              for b in{{ range .Values.buckets }} {{ . }}{{ end }}; do
                if printf '%s\n' "$existing" | grep -qx "$b"; then
                  echo "exists: $b"
                else
                  echo "creating: $b"
                  echo "s3.bucket.create -name $b" | weed shell -master="$master"
                fi
              done
              echo "Done."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
