# Sonarr Anime Helm Chart Values

# Image configuration
image:
  repository: lscr.io/linuxserver/sonarr
  # Sonarr v5 beta canary (LSIO develop branch). v5 migrates the database and
  # cannot be downgraded: rolling back means restoring a v4 backup taken before
  # the upgrade. sonarr and sonarr-uhd stay on v4 until this one has run clean.
  tag: "develop-5.0.0.2668-ls197"
  pullPolicy: IfNotPresent

# Service configuration
service:
  port: 8989

# Ingress configuration
ingress:
  enabled: true
  host: sonarr2.authoritah.tv
  clusterIssuer: letsencrypt-prod

# Node selection
nodeSelector:
  kubernetes.io/hostname: blacktalon

# Persistence
persistence:
  config:
    enabled: true
    size: 5Gi
    storageClass: local-path

  # Media directories (hostPath for large libraries)
  media:
    enabled: true
    anime:
      hostPath: /blacktalon/media/anime
      mountPath: /media/anime
    downloadsAnime:
      hostPath: /blacktalon/media/downloads/anime
      mountPath: /media/downloads/anime

# Environment variables
env:
  TZ: America/New_York
  PUID: "8675309"
  PGID: "8675309"

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
