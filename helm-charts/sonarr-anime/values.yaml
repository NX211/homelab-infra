# Sonarr Anime Helm Chart Values

# Image configuration
image:
  repository: lscr.io/linuxserver/sonarr
  # Sonarr v5 beta canary (LSIO develop branch). v5 migrates the database and
  # cannot be downgraded: rolling back means restoring a v4 backup taken before
  # the upgrade. sonarr and sonarr-uhd stay on v4 until this one has run clean.
  tag: "develop-5.0.0.2907-ls206"
  pullPolicy: IfNotPresent

# Service configuration
service:
  port: 8989

# Ingress configuration
ingress:
  enabled: true
  host: sonarr2.authoritah.tv
  clusterIssuer: letsencrypt-prod

# Node selection
nodeSelector:
  kubernetes.io/hostname: blacktalon

# Persistence
persistence:
  config:
    enabled: true
    size: 5Gi
    storageClass: local-path

  # Media directories (hostPath for large libraries)
  media:
    enabled: true
    anime:
      hostPath: /blacktalon/media/anime
      mountPath: /media/anime
    downloadsAnime:
      hostPath: /blacktalon/media/downloads/anime
      mountPath: /media/downloads/anime

# The UI sits behind Authelia forward-auth (IngressRoute middleware), so the app
# trusts it instead of showing its own login form. Current releases refuse the
# local-address bypass for any request carrying X-Forwarded-For, which Traefik
# always adds, so "Forms + disabled for local addresses" now means a second
# login after Authelia. API routes still require the API key either way, so the
# Authelia /api bypass stays key-protected. Allowed Hosts is the ingress host plus
# the in-cluster service names that Prowlarr/Seerr/Bazarr use; loopback and the pod
# hostname are always accepted.
auth:
  external: true

# Environment variables
env:
  TZ: America/New_York
  PUID: "8675309"
  PGID: "8675309"

# Resource limits
# v5 (.NET 10) needs far more headroom than v4. Evaluating search results for a long
# absolute-numbered series (e.g. My Hero Academia) throws OutOfMemoryException in
# DownloadDecisionMaker/RemoteEpisodeAggregationService and wedges the app: it did at
# 512Mi and again at 2Gi (.NET caps the heap at ~75% of the limit). 4Gi is a trial;
# if it still wedges, roll back to v4 from the pre-v5 backup.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 4Gi
