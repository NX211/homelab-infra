# Sonarr UHD Helm Chart Values

# Image configuration
image:
  repository: lscr.io/linuxserver/sonarr
  tag: "4.0.20.3014-ls329"
  pullPolicy: IfNotPresent

# Service configuration
service:
  port: 8989

# Ingress configuration
ingress:
  enabled: true
  host: sonarr3.authoritah.tv
  clusterIssuer: letsencrypt-prod

# Node selection
nodeSelector:
  kubernetes.io/hostname: blacktalon

# Persistence
persistence:
  config:
    enabled: true
    size: 5Gi
    storageClass: local-path

  # Media directories (hostPath for large libraries)
  media:
    enabled: true
    tvUhd:
      hostPath: /blacktalon/media/tv-uhd
      mountPath: /media/tv-uhd
    downloadsTvUhd:
      hostPath: /blacktalon/media/downloads/tv-uhd
      mountPath: /media/downloads/tv-uhd

# The UI sits behind Authelia forward-auth (IngressRoute middleware), so the app
# trusts it instead of showing its own login form. Current releases refuse the
# local-address bypass for any request carrying X-Forwarded-For, which Traefik
# always adds, so "Forms + disabled for local addresses" now means a second
# login after Authelia. API routes still require the API key either way, so the
# Authelia /api bypass stays key-protected. Allowed Hosts is the ingress host plus
# the in-cluster service names that Prowlarr/Seerr/Bazarr use; loopback and the pod
# hostname are always accepted.
auth:
  external: true

# Environment variables
env:
  TZ: America/New_York
  PUID: "8675309"
  PGID: "8675309"

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
