---
# Grafana admin credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin-user
        property: value
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-password
        property: value
---
# Grafana OAuth credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: grafana-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: grafana-oidc-client-id
        property: value
    - secretKey: client-secret
      remoteRef:
        key: grafana-oidc-client-secret
        property: value
---
# Pushover credentials for Alertmanager, from the staging-alertmanager app in
# the Homelab Bitwarden project. Read directly, not via the secrets-vault mirror:
# the mirror matched these names to coreyalan-staging's placeholder values.
#
# Alertmanager 0.27 reads these from files (user_key_file / token_file), so no
# credential is inlined in the chart values or anywhere else in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-pushover
    creationPolicy: Owner
  data:
    - secretKey: user-key
      remoteRef: { key: a46235fe-f9de-44b9-b454-b50c00f5d917 }   # pushover-user-key
    - secretKey: api-token
      remoteRef: { key: 52e6842f-7e5f-41fa-96fa-b50c00f5da0c }   # pushover-api-token
