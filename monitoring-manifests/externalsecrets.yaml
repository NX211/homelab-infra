---
# Grafana admin credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef: { key: ef175b60-8584-4fb3-9c7e-b3ff016770a1 }   # grafana-admin-user
    - secretKey: admin-password
      remoteRef: { key: 22062756-e40e-4469-be61-b3ff0167970b }   # grafana-admin-password
---
# Grafana OAuth credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: a797e033-bbab-446e-b906-b3d0003aada3 }   # grafana-oidc-client-id
    - secretKey: client-secret
      remoteRef: { key: 53d00fd9-18b4-41ad-9353-b3d0003ac188 }   # grafana-oidc-client-secret
---
# Pushover credentials for Alertmanager, from the staging-alertmanager app in
# the Homelab Bitwarden project. Read directly, not via the secrets-vault mirror:
# the mirror matched these names to coreyalan-staging's placeholder values.
#
# Alertmanager 0.27 reads these from files (user_key_file / token_file), so no
# credential is inlined in the chart values or anywhere else in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-pushover
    creationPolicy: Owner
  data:
    - secretKey: user-key
      remoteRef: { key: a46235fe-f9de-44b9-b454-b50c00f5d917 }   # pushover-user-key
    - secretKey: api-token
      remoteRef: { key: 52e6842f-7e5f-41fa-96fa-b50c00f5da0c }   # pushover-api-token
