---
# Grafana admin credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin-user
        property: value
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-password
        property: value
---
# Grafana OAuth credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: grafana-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: grafana-oidc-client-id
        property: value
    - secretKey: client-secret
      remoteRef:
        key: grafana-oidc-client-secret
        property: value
---
# Pushover credentials for Alertmanager. Same account prod alerts through
# (platform-infra terraform/modules/alerting), so staging pages the same place
# rather than inventing a second channel.
#
# Alertmanager 0.27 reads these from files (user_key_file / token_file), so no
# credential is inlined in the chart values or anywhere else in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-pushover
    creationPolicy: Owner
  data:
    - secretKey: user-key
      remoteRef:
        key: pushover-user-key
        property: value
    # Named api-token in secrets-vault; prod's terraform variable calls the same
    # value app_token.
    - secretKey: api-token
      remoteRef:
        key: pushover-api-token
        property: value
