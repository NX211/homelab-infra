---
# Supply-chain alerting.
#
# Tekton Chains has no metric that says whether it signed anything. It exposes
# only knative's generic watcher_reconcile_count, and the runs we know went
# unsigned for 51 days all counted as success="true" there — the controller logs
# the signing failure at `warn` and returns success. So Chains' own telemetry
# reproduces the exact blind spot that hid the original bug, and alerting on it
# would inherit that blindness.
#
# What can be watched is the cause. Signing depends on a Google ID token the
# refresher mints every 20 minutes, valid for 60. If that CronJob stops
# succeeding, the mounted token expires and Chains reverts to precisely the old
# silent failure: warn in the logs, `chains.tekton.dev/signed: "true"` on the
# object, no attestation, nothing surfaced. Watching the refresher catches that
# *before* it happens rather than after.
#
# The `release` label is load-bearing: this Prometheus selects rules with
# `ruleSelector.matchLabels.release: kube-prometheus-stack`, so without it the
# rule is accepted by the API server and silently never evaluated.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: supply-chain
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: supply-chain.rules
      rules:
        - alert: ChainsSigningCredentialStale
          # Fires with roughly 15 minutes of token validity left: the job runs
          # every 20 min and the token lives 60, so 45 min means two consecutive
          # runs have failed and the third is the last chance. Deliberately a
          # leading indicator — once the token actually expires the only symptom
          # is builds quietly going unsigned.
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob="chains-token-refresher"}) > 2700
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Tekton Chains signing credential is going stale — the token
              refresher has not succeeded in over 45 minutes.
            description: >-
              chains-token-refresher mints the Google ID token Fulcio validates.
              It is valid for 60 minutes and refreshed every 20. Once it expires,
              Chains stops signing but keeps annotating TaskRuns
              chains.tekton.dev/signed="true" and logs the failure only at warn,
              so nothing else will report this. Check the CronJob, then confirm
              the WIF subject allowlist still contains
              system:serviceaccount:tekton-pipelines:chains-token-refresher.
              Runbook: tekton/chains/README.md
        # Kyverno reports a credentials failure and a genuinely unsigned image
        # IDENTICALLY — both land as "unverified image" in a PolicyReport. That
        # ambiguity cost a multi-hour investigation on 2026-10-07: the Chains
        # signature and SLSA attestation were both perfectly valid (verified
        # independently with cosign), but the admission controller had been up 29
        # days holding a dead credential context and failed every STS exchange
        # with "context canceled" in ~400ms. A rollout restart fixed it. Nothing
        # alerted, because there were no Kyverno rules at all.
        #
        # Worse, `failurePolicy: Ignore` means that failure mode fails OPEN. Once
        # these policies move to Enforce, a credential fault does not block
        # deploys — it silently stops enforcing, and the only visible symptom is
        # a PolicyReport nobody is watching. These two rules are the prerequisite
        # for that flip.
        - alert: KyvernoImageVerificationFailing
          expr: |
            sum by (policy_name) (
              increase(kyverno_policy_results_total{rule_type="imageVerify", rule_result="fail"}[15m])
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Kyverno image verification is failing for policy
              {{ $labels.policy_name }}.
            description: >-
              This fires for BOTH causes and cannot distinguish them, because
              Kyverno does not: a genuinely unsigned or mis-signed image, and
              Kyverno being unable to reach the registry, both report as
              "unverified image".
              To tell them apart, read the controller log rather than the report:
              `kubectl logs -n kyverno deploy/kyverno-admission-controller | grep -i "image verification failed"`.
              A credentials fault names oauth2/google, STS or iamcredentials — in
              which case the image is probably fine and the controller is not.
              A real signature failure names the attestor or the digest.
              Confirm independently before touching the build:
              `cosign verify --certificate-identity <signer> --certificate-oidc-issuer <issuer> <image@digest>`.
              Runbook: kyverno-policies-business/verify-tekton-provenance.yaml
        # The discriminator the metric CAN give us. One bad image fails while
        # others still pass; a broken verifier fails everything. If no imageVerify
        # check has passed in the window and some have failed, the verifier itself
        # is the suspect, not the artifact.
        - alert: KyvernoImageVerificationSystemicallyFailing
          expr: |
            (
              sum(increase(kyverno_policy_results_total{rule_type="imageVerify", rule_result="fail"}[30m])) > 0
            )
            and
            (
              sum(increase(kyverno_policy_results_total{rule_type="imageVerify", rule_result="pass"}[30m])) == 0
            )
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: >-
              Every Kyverno image verification is failing — the verifier is
              broken, not the images.
            description: >-
              No imageVerify check has passed in 30 minutes while at least one has
              failed. A single unsigned image cannot produce this shape; a
              credentials or registry fault can, and did on 2026-10-07.
              First action is to restart the admission controller — the known
              failure is a long-lived pod holding a dead credential context:
              `kubectl rollout restart deploy/kyverno-admission-controller -n kyverno`.
              The rollout surges before terminating (maxUnavailable rounds to 0 at
              1 replica) so it opens no admission gap, even with Fail webhooks.
              If that does not clear it, verify the credential chain end to end
              before suspecting any image — see the sibling alert's description.
              Runbook: kyverno-policies-business/verify-tekton-provenance.yaml
        - alert: ArtifactRegistryPullCredentialStale
          # Same failure shape, different blast radius: image pulls, not signing.
          # This job had already failed twice unnoticed before alerts were
          # delivered anywhere.
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob="ar-token-refresher"}) > 3000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Artifact Registry pull credentials are going stale — the token
              refresher has not succeeded in over 50 minutes.
            description: >-
              ar-token-refresher rewrites the gcr-pull-secret-* secrets that
              staging, provisioning and capturly-live pull with. Existing pods
              keep running; new pulls start failing ImagePullBackOff once the
              token expires. Runbook: ar-token-refresher/README.md
