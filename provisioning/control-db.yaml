---
# Control DB for the provisioning engine (ADR-0019 Phase 2a). CloudNativePG
# single-instance Postgres on local-path (staging). CNPG generates the
# `provisioning-db-app` secret (keys: uri/host/user/password/dbname) — the engine
# reads DATABASE_URL from its `uri` key. Run `prisma migrate deploy` against it
# once (activation step 1) to create the Provisioning table.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: provisioning-db
  namespace: provisioning
spec:
  instances: 1
  # Pinned minor on the current "system" image line (legacy-compatible layout,
  # Debian trixie packages). The floating :16 tag had frozen on an ancient
  # bullseye digest whose 15 criticals were all fix:NONE in-distro.
  # Renovate-tracked so a fixed rebuild lands automatically.
  #
  # 16.11 -> 16.15 cleared the five criticals that had fixes published
  # (openssl CVE-2026-31789 x3, gnutls CVE-2026-33845 + CVE-2026-42010).
  # As of 2026-09-15 the report is 1 critical + 25 high, ALL fix:NONE in
  # trixie: the critical is libxml2 CVE-2026-6653 (UAF, DoS-only; Debian says
  # minor/no-dsa, fixed only in sid), the highs are perl/gnupg/expat/ncurses/
  # python3.13. Verified identical on the minimal- and standard- image lines,
  # and the latest tag rebuild still carries them — no variant or bump to
  # switch to. They clear when a trixie point release ships fixes; accepted
  # risk tracked as Port exemption exempt-provisioning-db-perl (expires
  # 2026-12-15), ref platform-infra#3649.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-system-trixie
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: provisioning
      owner: provisioning
