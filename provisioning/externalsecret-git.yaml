---
# GitHub App credentials for the onboarding workflow's GitOps handoff. The
# workflow (provisionOnboarding) commits Tenant CRs to NX211/homelab-infra with a
# short-lived App installation token. Dedicated App — Contents:write scoped to
# ONLY this repo, so the build/clone App stays read-only (tightest blast radius).
#
# Secrets live in the bitwarden-secrets-manager "Workbench" project
# (2ae99c5f-e9d6-4b1d-8a12-b3d000254de6) — App "coreyalan-onboarding" (app id
# 4411009), Contents:write on NX211/homelab-infra only.
#      ONBOARDING_GIT_APP_ID          — the dedicated App's numeric app id
#      ONBOARDING_GIT_APP_PRIVATE_KEY — the App's PEM private key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provisioning-git
  namespace: provisioning
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: provisioning-git
    creationPolicy: Owner
    template:
      engineVersion: v2
  data:
    - secretKey: app-id
      remoteRef: { key: cc29362f-10c9-4e62-be8e-b495000cb7b2 }   # ONBOARDING_GIT_APP_ID
    - secretKey: app-private-key
      remoteRef: { key: e4854b2f-86dd-4587-b7de-b495000cfb7d }   # ONBOARDING_GIT_APP_PRIVATE_KEY
