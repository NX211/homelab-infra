---
# Shared bearer token guarding the /onboarding seam (the one public inbound path
# to the control plane). The provisioning-webhook validates it (constant-time);
# coreyalan.com's producers + wizard present it. Same value on both sides.
#
# Secret lives in the bitwarden-secrets-manager "Workbench" project
# (2ae99c5f-e9d6-4b1d-8a12-b3d000254de6). coreyalan.com must present the SAME
# value as its PROVISIONING_SEAM_TOKEN env.
#      ONBOARDING_SEAM_TOKEN — a long random string (openssl rand -hex 32)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provisioning-onboarding-auth
  namespace: provisioning
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: provisioning-onboarding-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
  data:
    - secretKey: token
      remoteRef: { key: 568801c8-51d1-457f-a5c5-b495000cfbc3 }  # ONBOARDING_SEAM_TOKEN
