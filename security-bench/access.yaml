---
# The policies checks (section 5) list RBAC objects, service accounts and pods
# cluster-wide, and ask what any authenticated user may do. Read-only; no
# secrets. The token is only usable from this namespace's pods, which reach
# nothing but the API server (networkpolicy.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bench
  namespace: security-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-bench-read
rules:
  - apiGroups: [""]
    resources: [pods, serviceaccounts, namespaces]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list]
  # `kubectl auth can-i ... --as=system:authenticated` (5.1.x): the identity
  # every authenticated client already has, nothing more.
  - apiGroups: [""]
    resources: [users]
    resourceNames: [system:authenticated]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-bench-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-bench-read
subjects:
  - kind: ServiceAccount
    name: kube-bench
    namespace: security-bench
---
# The uploader in security-scans reads each node's result from the pod log.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-bench-results
  namespace: security-bench
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-bench-results
  namespace: security-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-bench-results
subjects:
  - kind: ServiceAccount
    name: scan-uploader
    namespace: security-scans
