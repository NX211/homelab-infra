---
# These pods can read the k3s server's keys, so they reach nothing but the API
# server (policies checks). No DNS: in-cluster kubectl uses the service IP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: security-bench
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-server-only
  namespace: security-bench
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 10.20.0.250/32 } # k3s API server (blacktalon)
      ports:
        - { protocol: TCP, port: 6443 }
