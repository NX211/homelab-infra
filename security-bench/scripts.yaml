---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-scripts
  namespace: security-bench
data:
  bench.sh: |
    #!/bin/bash
    # One node's CIS benchmark (VUL-2.7), k3s profile. Prints one JSON document
    # between markers and exits 0; the uploader (security-scans
    # cronjob-kube-bench-upload.yaml) reads it from this pod's log, checks that
    # every node reported, and decides whether the run succeeded.
    set -uo pipefail
    benchmark=k3s-cis-1.11
    started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    export K3S_STARTUP_LOG=/work/k3s-startup.log
    : > /work/result.json; : > /work/kube-bench.log
    status=ok; reason=""

    # Role from the running k3s process, not from which host paths exist.
    if pid=$(pgrep -o -f '^/usr/local/bin/k3s server( |$)'); then
      role=server; unit=k3s; targets=master,node,policies
      need=(kube-apiserver kube-scheduler kube-controller-manager kubelet kube-proxy)
      # The etcd section covers embedded etcd only; a SQLite datastore has none.
      [ -d /var/lib/rancher/k3s/server/db/etcd ] && targets=master,etcd,node,policies
    elif pid=$(pgrep -o -f '^/usr/local/bin/k3s agent( |$)'); then
      role=agent; unit=k3s-agent; targets=node
      need=(kubelet kube-proxy)
    else
      role=unknown; targets=""; status=failed; reason="no k3s server or agent process on this node"
    fi

    # The k3s checks read the arguments k3s logged when it last started. If that
    # window has rotated out of the journal they would print passing defaults,
    # so a missing line fails this node instead.
    if [ "$status" = ok ]; then
      since=$(date -d "$(ps -o lstart= -p "$pid")" +%s)
      /usr/bin/journalctl -m -u "$unit" --since "@$((since - 60))" --until "@$((since + 600))" \
        --no-pager > "$K3S_STARTUP_LOG" 2>> /work/kube-bench.log
      missing=""
      for c in "${need[@]}"; do grep -q "Running $c" "$K3S_STARTUP_LOG" || missing="$missing $c"; done
      if [ -n "$missing" ]; then
        status=failed
        reason="k3s startup arguments not in the journal for:${missing}"
      fi
    fi

    if [ "$status" = ok ]; then
      kube-bench run --config-dir /opt/kube-bench/cfg --config /opt/kube-bench/cfg/config.yaml \
        --benchmark "$benchmark" --targets "$targets" --json > /work/result.json 2>> /work/kube-bench.log
      rc=$?
      if [ $rc -ne 0 ] || ! jq -e '.Controls | length > 0' /work/result.json > /dev/null 2>&1; then
        status=failed
        reason="kube-bench exit $rc: $(tail -c 400 /work/kube-bench.log)"
        : > /work/result.json
      fi
    fi

    echo "-----BEGIN KUBE-BENCH RESULT-----"
    jq -n --slurpfile r /work/result.json \
      --arg node "${NODE_NAME:-}" --arg role "$role" --arg benchmark "$benchmark" \
      --arg commit "$(cat /etc/kube-bench-commit)" --arg targets "$targets" \
      --arg started "$started" --arg finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
      --arg status "$status" --arg reason "$reason" \
      '{schema: 1, node: $node, role: $role, benchmark: $benchmark, kube_bench_commit: $commit,
        targets: ($targets | split(",")), started_at: $started, finished_at: $finished,
        status: $status, reason: $reason, result: ($r[0] // null)}'
    echo "-----END KUBE-BENCH RESULT-----"
