---
# Collects the weekly CIS benchmark (security-bench/cronjob.yaml, 05:00, ends by
# 06:00) from its pod logs at 06:15, stores it as evidence and syncs failed checks to
# Port (VUL-2.7). Runs here, not in security-bench, so the identity that can
# write evidence never shares a pod with the host mounts.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench-upload
  namespace: security-scans
spec:
  schedule: "15 6 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 1209600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kube-bench-upload
            app.kubernetes.io/part-of: security-scans
        spec:
          serviceAccountName: scan-uploader
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: upload
              image: ghcr.io/nx211/scan-uploader:0.3.0
              env:
                - { name: TOOL, value: kube-bench }
                - { name: CLUSTER, value: homelab-staging }
                - { name: BENCH_NAMESPACE, value: security-bench }
                - { name: REQUIREMENTS, value: "VUL-2.7" }
                - { name: EVIDENCE_BUCKET, value: platform-infra-prod-compliance-evidence }
                - { name: WIF_AUDIENCE, value: //iam.googleapis.com/projects/861533890029/locations/global/workloadIdentityPools/homelab-staging/providers/k3s-oidc }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - { name: port, mountPath: /secrets/port, readOnly: true }
                - { name: gcp-token, mountPath: /var/run/gcp, readOnly: true }
                - { name: kube-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
          volumes:
            - { name: port, secret: { secretName: security-scans-port } }
            - name: gcp-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: //iam.googleapis.com/projects/861533890029/locations/global/workloadIdentityPools/homelab-staging/providers/k3s-oidc
                      expirationSeconds: 3600
                      path: token
            - name: kube-token
              projected:
                sources:
                  - serviceAccountToken: { expirationSeconds: 3600, path: token }
                  - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
                  - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
