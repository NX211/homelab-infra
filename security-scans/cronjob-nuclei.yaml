---
# Weekly Nuclei scan of every staging app (VUL-2.8), staging only. The scan runs as
# an init container, then the uploader stores the evidence and syncs findings.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nuclei
  namespace: security-scans
spec:
  schedule: "0 10 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 28800
      ttlSecondsAfterFinished: 1209600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nuclei
            app.kubernetes.io/part-of: security-scans
        spec:
          serviceAccountName: scan-uploader
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: scan
              image: ghcr.io/nx211/nuclei
              command: [sh, /scripts/nuclei.sh]
              env:
                - { name: REPORTS_DIR, value: /reports }
                - { name: HOME, value: /home/scanner }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 250m, memory: 512Mi }
                limits: { memory: 2Gi }
              volumeMounts:
                - { name: reports, mountPath: /reports }
                - { name: targets, mountPath: /config, readOnly: true }
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: wrk, mountPath: /work }
                - { name: home, mountPath: /home/scanner }
                - { name: tmp, mountPath: /tmp }
          containers:
            - name: upload
              image: ghcr.io/nx211/scan-uploader
              env:
                - { name: TOOL, value: nuclei }
                - { name: REQUIREMENTS, value: "VUL-2.8" }
                - { name: EVIDENCE_BUCKET, value: platform-infra-prod-compliance-evidence }
                - { name: WIF_AUDIENCE, value: //iam.googleapis.com/projects/861533890029/locations/global/workloadIdentityPools/homelab-staging/providers/k3s-oidc }
                - name: RUN_ID
                  valueFrom: { fieldRef: { fieldPath: "metadata.labels['batch.kubernetes.io/job-name']" } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: reports, mountPath: /reports, readOnly: true }
                - { name: targets, mountPath: /config, readOnly: true }
                - { name: port, mountPath: /secrets/port, readOnly: true }
                - { name: gcp-token, mountPath: /var/run/gcp, readOnly: true }
                - { name: kube-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
          volumes:
            - { name: reports, emptyDir: {} }
            - { name: wrk, emptyDir: {} }
            - { name: home, emptyDir: {} }
            - { name: tmp, emptyDir: {} }
            - { name: targets, configMap: { name: scan-targets } }
            - { name: scripts, configMap: { name: scan-scripts } }
            - { name: port, secret: { secretName: security-scans-port } }
            - name: gcp-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: //iam.googleapis.com/projects/861533890029/locations/global/workloadIdentityPools/homelab-staging/providers/k3s-oidc
                      expirationSeconds: 3600
                      path: token
            - name: kube-token
              projected:
                sources:
                  - serviceAccountToken: { expirationSeconds: 3600, path: token }
                  - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
                  - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
