---
# The Port webhook URL (platform-infra security-scans.tf, port_webhook
# security_scans). Its mapping can only write securityFinding entities for the
# listed services, so the URL is the scanner's whole Port reach: no org API pair.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: security-scans-port
  namespace: security-scans
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-build-platform
    kind: ClusterSecretStore
  target:
    name: security-scans-port
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef: { key: 77d0f074-6255-4d69-b4c4-b50e00385904 }   # SECURITY_SCANS_PORT_WEBHOOK_URL (Build Platform)
