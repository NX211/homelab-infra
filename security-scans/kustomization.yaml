# Weekly security scans of the staging apps (ZAP baseline, Nuclei). Plan,
# requirement mapping and evidence layout: platform-infra security-scans.tf.
# Digests are pinned by .github/workflows/build-security-scanners.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - access.yaml
  - networkpolicy.yaml
  - externalsecret.yaml
  - targets.yaml
  - scripts.yaml
  - cronjob-zap.yaml
  - cronjob-nuclei.yaml
  - cronjob-kube-bench-upload.yaml
images:
  - name: ghcr.io/nx211/zap
    newTag: "2.17.0"
    digest: sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
  - name: ghcr.io/nx211/nuclei
    newTag: "3.11.1-templates-10.5.2"
    digest: sha256:8d2933cbeed668508b6563bfb072184fb4fb759317fd629a7d470b6225156eb4
  - name: ghcr.io/nx211/scan-uploader
    newTag: "0.2.1"
    digest: sha256:f892276391d4e9ff1dd75be39b68a7811802aab06defc09c5701616ab596be42
