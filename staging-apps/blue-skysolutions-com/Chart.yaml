apiVersion: v2
name: blue-skysolutions-com-staging
description: blue-skysolutions.com - Staging Environment, on prod's nextjs-app chart
type: application
# 2.0.0: moved from the staging-app chart to nextjs-app (the chart prod
# renders, published as an OCI artifact), in its own namespace (X4 app parity).
version: 2.0.0
appVersion: "0.1.23"
maintainers:
  - name: Homelab Admin
dependencies:
  # Published and keyless-signed by platform-infra publish-charts.yml; Argo CD
  # pulls it with the ESO-minted Artifact Registry token.
  - name: nextjs-app
    version: "1.19.0"
    repository: "oci://us-central1-docker.pkg.dev/platform-infra-prod/helm-charts"
