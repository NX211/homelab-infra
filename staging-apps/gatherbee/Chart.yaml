apiVersion: v2
name: gatherbee-staging
description: gatherbee.org - Staging Environment, on prod's nextjs-app chart
type: application
# 2.0.0: moved from the staging-app chart to nextjs-app (the chart prod
# renders, published as an OCI artifact) and into its own namespace,
# gatherbee-staging (X4 app parity).
version: 2.0.0
appVersion: "0.6.3"
keywords:
  - gatherbee
  - nextjs
  - staging
maintainers:
  - name: Homelab Admin
dependencies:
  # Published and keyless-signed by platform-infra publish-charts.yml. Argo CD
  # pulls it with the ESO-minted Artifact Registry token
  # (external-secrets-operator/manifests/argocd-helm-charts-repo.yaml).
  - name: nextjs-app
    version: "1.19.0"
    repository: "oci://us-central1-docker.pkg.dev/platform-infra-prod/helm-charts"
