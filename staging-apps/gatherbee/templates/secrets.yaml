# Bitwarden store for this app's staging project, and the app Secret built
# from it. Cluster-scoped store name kept from the staging-app chart.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-staging-gatherbee
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    bitwardensecretsmanager:
      auth:
        secretRef:
          credentials:
            name: {{ .Values.bitwarden.credentialsSecret }}
            namespace: external-secrets-system
            key: token
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets-system.svc.cluster.local:9998
      organizationID: {{ .Values.bitwarden.organizationID | quote }}
      projectID: {{ .Values.bitwarden.projectID | quote }}
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets-system
        key: ca.crt
---
# Wave -4: ahead of the migrate hook (-1) and the Deployment, which read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: bitwarden-staging-gatherbee
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key }}
    {{- end }}
