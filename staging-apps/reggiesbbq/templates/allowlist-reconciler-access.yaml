# The allowlist-reconciler's access to this namespace: read the base ConfigMap,
# patch the Middleware. Declared with the app so it exists with the namespace.
# App-specific name, so it can never collide with the reconciler's own Role in
# `staging`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allowlist-reconciler-reggiesbbq
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allowlist-reconciler-reggiesbbq
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: allowlist-reconciler-reggiesbbq
subjects:
  - kind: ServiceAccount
    name: allowlist-reconciler
    namespace: staging
