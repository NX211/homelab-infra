---
# OAuth client the Tailscale operator authenticates with (the chart's
# oauth.clientId/clientSecret are left empty so it reads this Secret instead).
# Applied by hand until now; read from the Homelab Bitwarden project by ID.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef: { key: 62697123-4d28-42bf-8711-b4030102f7bd }   # tailscale-oauth-client-id
    - secretKey: client_secret
      remoteRef: { key: 53a70678-33f0-4f67-9222-b40301031523 }   # tailscale-oauth-client-secret
