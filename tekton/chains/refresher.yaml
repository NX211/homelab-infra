---
# Keyless credentials for Tekton Chains.
#
# Chains was installed in Phase 0 but never signed anything: `signing-secrets`
# is empty, so the x509 signer failed to configure and every TaskRun was still
# annotated `chains.tekton.dev/signed: "true"` — a "reconciled" marker, not
# evidence. See tekton/chains/README.md.
#
# The design calls for keyless Sigstore (ADR-0005), but this cluster's issuer
# (kubernetes.default.svc.cluster.local) is not resolvable by public Fulcio, so
# the projected token the operator already mounts at cosign's default path is
# unusable. Instead this CronJob federates that same token to GCP — the pool
# holds the k3s JWKS inline — and mints a *Google* ID token, whose issuer
# (accounts.google.com) Fulcio does trust.
#
# It writes one Secret with two keys:
#   oidc-token   the Google ID token (aud=sigstore) Chains presents to Fulcio
#   config.json  an Artifact Registry token, so Chains can push the attestation
#                next to the image (artifacts.*.storage: oci)
#
# GCP side: platform-infra/terraform/environments/prod/homelab-wif.tf
apiVersion: v1
kind: ConfigMap
metadata:
  name: chains-token-refresher
  namespace: tekton-pipelines
data:
  refresh.sh: |
    #!/bin/sh
    set -eu

    AUDIENCE="//iam.googleapis.com/projects/861533890029/locations/global/workloadIdentityPools/homelab-staging/providers/k3s-oidc"
    SIGNER_SA="homelab-chains-signer@platform-infra-prod.iam.gserviceaccount.com"
    REGISTRY="us-central1-docker.pkg.dev"
    NS="tekton-pipelines"
    SECRET="chains-keyless-creds"
    TOKEN_FILE="/var/run/secrets/gcp-sts/token"

    b64() { base64 | tr -d '\n'; }

    SUBJECT_TOKEN="$(cat "$TOKEN_FILE")"

    # 1) Exchange the projected k3s token for a federated Google access token.
    FED_TOKEN="$(jq -nc --arg aud "$AUDIENCE" --arg st "$SUBJECT_TOKEN" '{
        audience:$aud,
        grantType:"urn:ietf:params:oauth:grant-type:token-exchange",
        requestedTokenType:"urn:ietf:params:oauth:token-type:access_token",
        scope:"https://www.googleapis.com/auth/cloud-platform",
        subjectTokenType:"urn:ietf:params:oauth:token-type:jwt",
        subjectToken:$st
      }' | curl -sf -X POST https://sts.googleapis.com/v1/token \
            -H 'Content-Type: application/json' -d @- | jq -r '.access_token')"
    [ -n "$FED_TOKEN" ] && [ "$FED_TOKEN" != "null" ] || { echo "STS exchange failed"; exit 1; }

    # 2) Mint a Google ID token as the signer SA. `audience: sigstore` is what
    #    Fulcio expects; `includeEmail` puts the SA address in the `email` claim,
    #    which becomes the certificate SAN — and so the identity a verifier pins.
    #    Without includeEmail the token has only the numeric `sub` and Fulcio
    #    rejects it for the accounts.google.com (email-type) issuer.
    ID_TOKEN="$(curl -sf -X POST \
        "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${SIGNER_SA}:generateIdToken" \
        -H "Authorization: Bearer ${FED_TOKEN}" -H 'Content-Type: application/json' \
        -d '{"audience":"sigstore","includeEmail":true}' | jq -r '.token')"
    [ -n "$ID_TOKEN" ] && [ "$ID_TOKEN" != "null" ] || { echo "generateIdToken failed"; exit 1; }

    # 3) Mint an AR access token as the same SA. Chains stores the attestation in
    #    the registry beside the image, which needs write, not the read the
    #    ar-token-refresher's puller SA holds.
    AR_TOKEN="$(curl -sf -X POST \
        "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${SIGNER_SA}:generateAccessToken" \
        -H "Authorization: Bearer ${FED_TOKEN}" -H 'Content-Type: application/json' \
        -d '{"scope":["https://www.googleapis.com/auth/cloud-platform"]}' | jq -r '.accessToken')"
    [ -n "$AR_TOKEN" ] && [ "$AR_TOKEN" != "null" ] || { echo "generateAccessToken failed"; exit 1; }

    AUTH_B64="$(printf 'oauth2accesstoken:%s' "$AR_TOKEN" | b64)"
    DOCKERCFG_B64="$(jq -nc --arg reg "$REGISTRY" --arg tok "$AR_TOKEN" --arg auth "$AUTH_B64" \
        '{auths:{($reg):{username:"oauth2accesstoken",password:$tok,auth:$auth}}}' | b64)"

    printf '%s\n' \
      'apiVersion: v1' \
      'kind: Secret' \
      'metadata:' \
      "  name: ${SECRET}" \
      "  namespace: ${NS}" \
      'type: Opaque' \
      'data:' \
      "  oidc-token: $(printf '%s' "$ID_TOKEN" | b64)" \
      "  config.json: ${DOCKERCFG_B64}" \
      | kubectl apply -f -

    # Surface the identity and expiry rather than the token. If a signature is
    # ever attributed to the wrong SA, this line is the record of who signed.
    echo "refreshed ${NS}/${SECRET} as ${SIGNER_SA}"
    echo "  id-token exp: $(printf '%s' "$ID_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.exp | todate' 2>/dev/null || echo unknown)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chains-token-refresher
  namespace: tekton-pipelines
spec:
  # Google ID tokens live 1h. Refreshing every 20min means a token is at most
  # ~20min old when Chains reads it, leaving ~40min of validity — enough slack to
  # absorb a couple of failed runs plus the ~1min kubelet takes to project an
  # updated Secret into the mounted volume.
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: chains-token-refresher
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            # Pinned high deliberately (KSV-0021): without runAsGroup the pod
            # lands in GID 0, so a root-group-readable file on any future mount
            # would be readable by this script. The /tmp emptyDir is 0777, so
            # nothing here depends on the group.
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresher
              image: alpine/k8s:1.37.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/refresh.sh"]
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: gcp-sts-token
                  mountPath: /var/run/secrets/gcp-sts
                  readOnly: true
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            # The federated subject token. Its audience must equal AUDIENCE in
            # the script and the WIF provider's expected audience.
            - name: gcp-sts-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: //iam.googleapis.com/projects/861533890029/locations/global/workloadIdentityPools/homelab-staging/providers/k3s-oidc
                      expirationSeconds: 3600
                      path: token
            - name: script
              configMap:
                name: chains-token-refresher
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
