---
# Exposes the K3s API server to prod GKE ArgoCD for cluster registration, via
# Traefik TLS-passthrough on the existing websecure entrypoint (no new port).
#
# - HostSNI(staging-k8s.coreyalan.com) is matched at the TCP layer and passed
#   through untouched, so the client (ArgoCD) terminates TLS against the API
#   server's own cert. That cert must carry `staging-k8s.coreyalan.com` in its
#   SANs (k3s `tls-san` in /etc/rancher/k3s/config.yaml on blacktalon).
# - The API is cluster-admin-reachable, so the TCP router is locked to prod
#   GKE's Cloud NAT egress IP (35.254.175.13) via the ipAllowList middleware.
#
# NOTE: if the homelab edge/proxy (yellowtalon) does not preserve the client
# source IP to Traefik, the allowlist will see the edge IP instead of GKE's and
# block the connection. If registration fails at first connect, either enable
# PROXY protocol on the edge->Traefik path, allowlist the forwarded range, or
# (least preferred) drop the middleware and rely on TLS + the bearer token.
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: argocd-source-allow
  namespace: default
spec:
  ipAllowList:
    sourceRange:
      - 35.254.175.13/32 # prod GKE Cloud NAT egress (platform-infra-prod)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: staging-k8s-api
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`staging-k8s.coreyalan.com`)
      services:
        - name: kubernetes # the in-cluster API service (default/kubernetes:443 -> 6443)
          port: 443
      middlewares:
        - name: argocd-source-allow
  tls:
    passthrough: true
